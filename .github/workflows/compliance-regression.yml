name: Compliance regression (F45)

on:
  schedule:
    # Mondays 06:00 UTC — catches any drift from the preceding week's merges.
    - cron: "0 6 * * 1"
  pull_request:
    paths:
      - "src/kryon/compliance/**"
      - "src/kryon/reporting/multi_framework_pdf.py"
      - "scripts/compliance/**"
      - "tests/compliance/**"
      - ".github/workflows/compliance-regression.yml"
  workflow_dispatch:

jobs:
  regression:
    name: Compliance framework regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run regression harness (structural)
        run: python scripts/compliance/regression_bench.py --check

      - name: Run compliance pytest subset
        run: |
          pytest tests/compliance/ -v \
            --deselect tests/compliance/test_pci_report.py \
            --deselect tests/compliance/test_soc2_report.py

      - name: Emit human-readable diff summary on failure
        if: failure()
        run: python scripts/compliance/regression_bench.py --diff || true
