name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,orchestration,rag,reporting]"

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build dashboard
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Run E2E tests
        env:
          OPENAI_API_KEY: sk-dummy-key-for-ci
          KRYON_DEBUG: "1"
        run: |
          pytest tests/e2e/ -v -m e2e --tb=short

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            tests/e2e/screenshots/
            tests/e2e/videos/
