name: KRYON CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install project with dev dependencies
        run: pip install -e ".[dev]"

      - name: Check code style
        run: ruff check src/ tests/

      - name: Check formatting
        run: ruff format --check src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,orchestration,viz,voice,tracing]"

      - name: Run tests with coverage
        env:
          OPENAI_API_KEY: sk-dummy-key-for-ci
          KRYON_TELEMETRY: "false"
          KRYON_TRACING: "false"
          # Enable red-team modules in CI so tests that exercise
          # kryon.tools.{evasion,lateral_movement,post_exploitation,
          # privilege_escalation} can import. F12.8 gates these off in
          # production but the unit/integration tests need them
          # available to make any assertion at all.
          KRYON_RED_TEAM: "true"
        run: |
          pytest tests/ -v \
            --ignore=tests/agents/test_agent_inference.py \
            --ignore=tests/agents/test_agent_one_tool.py \
            --ignore=tests/tui \
            --ignore=tests/reporting \
            --ignore=tests/knowledge \
            --ignore=tests/e2e \
            --ignore=tests/test_exploitdb_scraper.py \
            --ignore=tests/test_llm_cache.py \
            --ignore=tests/test_async_rag.py \
            --ignore=tests/test_rag_system.py \
            --ignore=tests/test_tool_availability.py \
            --ignore=tests/voice/test_workflow.py \
            --ignore=tests/mcp/test_mcp_tracing.py \
            --ignore=tests/autonomous \
            --ignore=tests/tools/test_orchestrator_turns.py \
            --ignore=tests/tools/test_pentest_planner.py \
            -m "not integration and not slow and not e2e" \
            --cov=src/kryon --cov-report=xml \
            --tb=short

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
