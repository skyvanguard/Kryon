[pytest]
# Pytest configuration for SKYNET framework

# Test discovery
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Markers for organizing tests
markers =
    unit: Unit tests for individual functions
    integration: Integration tests requiring external services
    slow: Tests that take more than 5 seconds
    ctf: CTF-specific functionality tests
    agent: Agent-related tests
    tool: Tool-related tests
    security: Security and guardrail tests
    optional: Tests for optional dependencies
    allow_call_model_methods: mark test as allowing calls to real model implementations

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    # --cov-branch  # Requires pytest-cov to be installed

# Coverage options
[coverage:run]
source = src/skynet
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract
