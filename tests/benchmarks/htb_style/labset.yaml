# F81 — HTB-style benchmark labset
#
# Curated 30 reproducible targets covering the OWASP Top 10 and common
# HTB-Easy patterns. Each `slug` here MUST have a matching JSON file in
# `walkthroughs/<slug>.json`. Source flagged "ToS-safe": all OSS, no
# scraping of HTB/THM live infra.
#
# Categories balanced for the public scoreboard (F83) — see
# docs/PLAN_PARITY_CAI.md F81 for the rationale.

version: 1
labset_name: "Kryon HTB-style v1 (30 targets)"
created: "2026-04-29"

categories_target:
  sqli: 4
  xss: 3
  rce: 4
  auth: 3
  idor: 2
  ssrf: 2
  priv-esc: 4
  recon: 2
  api: 3
  crypto: 2
  ssl: 1

# Status legend:
#   ready   — walkthrough JSON exists, target source verified spawnable
#   wip     — walkthrough drafted, target source not yet validated
#   planned — slot reserved, no walkthrough yet
