# F82 — TryHackMe-style benchmark labset
#
# Same harness as F81, different curated set. THM rooms come in three
# flavors:
#   1. AttackBox-only (need a paid VIP subscription + the THM-provided
#      browser VM)
#   2. Self-hostable (room provides a docker-compose / vagrant box)
#   3. External link (room is a wrapper around a vendor's free lab —
#      e.g. PortSwigger Academy linked from a THM room)
#
# We curate ToS-safe equivalents for each flavor:
#   - flavor 1 → re-use the OSS reproducer from VulnHub or vulhub
#   - flavor 2 → the docker-compose version directly
#   - flavor 3 → the external lab URL (PortSwigger / OWASP), since
#     those vendors explicitly allow automated tools on their free
#     training environments
#
# This labset MUST be reproducible by any third party without a THM
# account — that's the fair-play contract from F83.

version: 1
labset_name: "Kryon TryHackMe-style v1 (20 targets)"
created: "2026-04-29"

categories_target:
  sqli: 3
  xss: 2
  rce: 3
  auth: 2
  privesc: 3
  recon: 2
  api: 2
  network: 2
  forensics: 1

