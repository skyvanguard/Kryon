# SKYNET Pre-commit Configuration
# Automated quality checks before commits
# Run manually: pre-commit run --all-files

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      # Linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      # Formatter
      - id: ruff-format
        types_or: [python, pyi]

  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --check-untyped-defs]
        additional_dependencies:
          - types-PyYAML
          - types-requests
        exclude: ^(tests/|examples/|scripts/)

  # Python code quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # File formatting
      - id: trailing-whitespace
        exclude: ^(\.github/|docs/)
      - id: end-of-file-fixer
        exclude: ^(\.github/|docs/)
      - id: mixed-line-ending
        args: [--fix=lf]

      # Python checks
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]

      # JSON/YAML/TOML checks
      - id: check-json
      - id: check-yaml
        exclude: ^(\.github/workflows/)
      - id: check-toml

      # Git checks
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

      # Security
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  # Pytest - Run fast unit tests only
  # Disabled for Windows - pytest path needs standardization
  # TODO: Re-enable after environment standardization
  # - repo: local
  #   hooks:
  #     - id: pytest-check
  #       name: pytest-check
  #       entry: pytest
  #       language: system
  #       pass_filenames: false
  #       always_run: false
  #       args:
  #         - tests/
  #         - -m
  #         - "unit and not slow"
  #         - --tb=short
  #         - -q
  #         - --maxfail=3
  #       stages: [pre-commit]

# Configuration
default_stages: [pre-commit]
fail_fast: false
minimum_pre_commit_version: '2.20.0'
