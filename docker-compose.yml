# =============================================================================
# KRYON - Development Docker Compose
# =============================================================================
# Usage: docker compose up -d
# =============================================================================

services:
  kryon-server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: kryon-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8700:8700"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-not-set}
      - KRYON_DEBUG=${KRYON_DEBUG:-0}
      - KRYON_MODEL=${KRYON_MODEL:-gpt-4o}
      - KRYON_GUARDRAILS=${KRYON_GUARDRAILS:-true}
    volumes:
      - kryon-data:/home/kryon/.kryon
    networks:
      - kryon-dev

  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: kryon-chromadb
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - kryon-dev

volumes:
  kryon-data:
    driver: local
  chromadb-data:
    driver: local

networks:
  kryon-dev:
    driver: bridge
