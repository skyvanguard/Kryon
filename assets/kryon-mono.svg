<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kryon">
  <title>Kryon</title>
  <!-- Monochrome core — uses currentColor, so it inherits the surrounding text
       color. For seals, engraving, single-ink print, or difficult backgrounds. -->
  <g fill="none" stroke="currentColor" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="50,12 82.9,31 82.9,69 50,88 17.1,69 17.1,31" stroke-width="4"/>
    <g stroke-width="2.4" opacity="0.9">
      <line x1="50" y1="50" x2="50" y2="12"/>
      <line x1="50" y1="50" x2="82.9" y2="31"/>
      <line x1="50" y1="50" x2="82.9" y2="69"/>
      <line x1="50" y1="50" x2="50" y2="88"/>
      <line x1="50" y1="50" x2="17.1" y2="69"/>
      <line x1="50" y1="50" x2="17.1" y2="31"/>
    </g>
  </g>
  <circle cx="50" cy="50" r="7" fill="currentColor"/>
</svg>
