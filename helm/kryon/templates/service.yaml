---
# Server Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kryon.fullname" . }}-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kryon.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.server.service.type }}
  ports:
  - port: {{ .Values.server.service.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "kryon.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
