apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kryon.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kryon.labels" . | nindent 4 }}
    app.kubernetes.io/component: secrets
type: Opaque
data:
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.apiKey }}
  API_KEY: {{ .Values.secrets.apiKey | b64enc | quote }}
  {{- else }}
  API_KEY: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.credentialKey }}
  CREDENTIAL_KEY: {{ .Values.secrets.credentialKey | b64enc | quote }}
  {{- else }}
  CREDENTIAL_KEY: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.ollamaBaseUrl }}
  OLLAMA_BASE_URL: {{ .Values.secrets.ollamaBaseUrl | b64enc | quote }}
  {{- end }}
