---
# Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kryon.fullname" . }}-server
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kryon.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kryon.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kryon.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kryon.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext.server | nindent 8 }}
      containers:
      - name: server
        image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.server.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.server.service.targetPort }}
          protocol: TCP
        envFrom:
        - configMapRef:
            name: {{ include "kryon.fullname" . }}-config
        - secretRef:
            name: {{ include "kryon.fullname" . }}-secrets
        livenessProbe:
          {{- toYaml .Values.server.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.server.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.server.resources | nindent 10 }}
        volumeMounts:
        - name: kryon-data
          mountPath: {{ .Values.config.dataDir }}
      volumes:
      - name: kryon-data
        {{- if .Values.persistence.enabled }}
        persistentVolumeClaim:
          claimName: {{ include "kryon.fullname" . }}-data-pvc
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
