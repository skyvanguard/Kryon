apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kryon.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kryon.labels" . | nindent 4 }}
    app.kubernetes.io/component: configuration
data:
  KRYON_DEBUG: {{ .Values.config.debug | quote }}
  KRYON_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  KRYON_RATE_LIMIT: {{ .Values.config.rateLimit | quote }}
  KRYON_HOST: {{ .Values.config.host | quote }}
  KRYON_PORT: {{ .Values.config.port | quote }}
  KRYON_DATA_DIR: {{ .Values.config.dataDir | quote }}
