[project]
name = "kryon"
version = "1.1.0"
description = "KRYON - Autonomous Cybersecurity Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "kryon-security" }]
dependencies = [
    # logging and visualization
    "folium>=0.15.0, <1",
    "matplotlib>=3.0, <4",
    "numpy>=1.21, <3",
    "pandas>=1.3, <3",
    # core kryon
    "openai>=2.16.0,<3",
    "pydantic>=2.10, <3",
    "griffe>=1.5.6, <2",
    "typing-extensions>=4.12.2, <5",
    "requests>=2.0, <3",
    "types-requests>=2.0, <3",
    # openinference moved to optional-dependencies[tracing] for Python 3.14+ compatibility
    "wasabi>=1.1.3",
    "rich>=13.9.4",
    "prompt_toolkit>=3.0.39",
    "questionary>=2.0.0",
    "python-dotenv>=0.9.9",
    "litellm>=1.63.7",  # Note: [proxy] removed for Windows compatibility (uvloop not supported)
    "mako>=1.3.8",
    "mcp>=1.23.0; python_version >= '3.10'",
    "paramiko>=3.5.1",
    "dnspython>=2.4.0, <3",
    "networkx>=3.0, <4",
    "pypdf>=5.0.0, <6",
    "duckduckgo-search>=7.0, <8",
    "defusedxml>=0.7.1, <1",
]
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/skyvanguard/Kryon"
Repository = "https://github.com/skyvanguard/Kryon"
Issues = "https://github.com/skyvanguard/Kryon/issues"
Changelog = "https://github.com/skyvanguard/Kryon/releases"

[project.optional-dependencies]
voice = ["numpy>=2.2.0, <3; python_version>='3.10'", "websockets>=15.0, <17"]
viz = ["graphviz>=0.17"]
tracing = ["openinference-instrumentation-openai>=0.1.22; python_version<'3.14'"]
rag = [
    "chromadb>=1.2.0",
    "schedule>=1.2.0",
    "sentence-transformers>=5.0.0",
]
server = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
]
tui = [
    "textual>=3.0.0",
]
reporting = [
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
]
orchestration = [
    "apscheduler>=3.10.0",
]
dev = [
    "mypy",
    "ruff==0.15.0",
    "pytest",
    "pytest-asyncio",
    "pytest-mock>=3.14.0",
    "pytest-cov",
    "coverage>=7.6.12",
    "inline-snapshot>=0.20.7",
    "playwright==1.58.0",
    "httpx>=0.27.0",
]

[tool.uv.workspace]
members = ["agents"]

[tool.uv.sources]
agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    ".trunk/",
    ".git/",
    ".vscode/",
    ".devcontainer/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    "venv/",
    ".venv/",
    "dist/",
    "build/",
    "*.egg-info/",
    "workspaces/",
    "benchmarks/",
    "logs/",
    "site/",
    ".kryon/",
    "nohup.out",
    "ci/",
    "tools/cut_the_rope/"
]

[tool.hatch.build.targets.wheel]
packages = ["src/kryon"]
exclude = [
    ".trunk/",
    ".git/",
    ".vscode/",
    ".devcontainer/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    "venv/",
    ".venv/",
    "dist/",
    "build/",
    "*.egg-info/",
    "workspaces/",
    "benchmarks/",
    "logs/",
    "site/",
    ".kryon/",
    "nohup.out",
    "ci/",
    "tools/cut_the_rope/"
]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
exclude = [
    ".trunk/",
    ".git/",
    ".vscode/",
    ".devcontainer/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    "venv/",
    ".venv/",
    "dist/",
    "build/",
    "*.egg-info/",
    "workspaces/",
    "benchmarks/",
    "logs/",
    "site/",
    ".kryon/",
    "nohup.out",
    "ci/",
    "tools/cut_the_rope/"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "UP007",  # Use X | Y for type unions (requires Python 3.10+ runtime)
    "UP035",  # Import from collections.abc (compatibility with older code)
    "UP045",  # Use X | None instead of Optional[X] (requires Python 3.10+ runtime)
    "B905",   # zip() without strict= (added in Python 3.10)
]
isort = { combine-as-imports = true, known-first-party = ["agents"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "E402", "F401", "F841"]
# Files with mathematical formulas/long docstrings
"src/kryon/agents/*.py" = ["E501", "E402"]
# Files with security tool documentation
"src/kryon/tools/**/*.py" = ["E501"]
# Files with UI strings and long messages
"src/kryon/repl/**/*.py" = ["E501", "E402"]
"src/kryon/sdk/**/*.py" = ["E501", "E402"]
"src/kryon/knowledge/**/*.py" = ["E501"]
"src/kryon/intelligence/**/*.py" = ["E501"]
"src/kryon/reporting/**/*.py" = ["E501", "B904"]
"src/kryon/server/**/*.py" = ["E501", "B904", "B008"]
"src/kryon/memory/**/*.py" = ["E501"]
"src/kryon/evaluation/**/*.py" = ["E501"]
"src/kryon/compliance/**/*.py" = ["E501"]
"src/kryon/engagements/**/*.py" = ["E501", "E402"]
"src/kryon/remediation/**/*.py" = ["E501"]
"src/kryon/tenancy/**/*.py" = ["E501"]
"src/kryon/onboarding/**/*.py" = ["B904"]
"src/kryon/billing/**/*.py" = ["B904"]
"src/kryon/notifications/**/*.py" = ["E501"]
"src/kryon/tui/**/*.py" = ["E501"]
# Files with intentional late imports (warning config, circular import avoidance)
"src/kryon/cli/*.py" = ["E402", "E501"]
"src/kryon/agents/hk_aerial.py" = ["E402"]
"src/kryon/agents/patterns/__init__.py" = ["E402"]

[tool.mypy]
strict = false
warn_return_any = false
warn_unused_ignores = false
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
no_implicit_optional = false

[[tool.mypy.overrides]]
module = "sounddevice.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "kryon.tools.*",
    "kryon.agents.*",
    "kryon.knowledge.*",
    "kryon.repl.*",
    "kryon.cache.*",
    "kryon.cli",
    "kryon.cli.*",
    "kryon.sdk.agents.global_usage_tracker",
    "kryon.sdk.agents.voice.*",
    "kryon.sdk.agents.models.openai_chatcompletions",
    "kryon.sdk.agents.models.openai_responses",
    "kryon.sdk.agents.mcp.*",
    "kryon.sdk.agents._run_impl",
    "kryon.sdk.agents.run",
    "kryon.sdk.agents.run_to_jsonl",
    "kryon.sdk.agents.parallel_tool_executor",
]
ignore_errors = true

[tool.coverage.run]
source = ["tests", "src/kryon/sdk/agents"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"
exclude_also = [
    # This is only executed while typechecking
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
    "logger.debug",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    # This is a warning that is expected to happen: we have an async filter that raises an exception
    "ignore:coroutine 'test_async_input_filter_fails.<locals>.invalid_input_filter' was never awaited:RuntimeWarning",
]
markers = [
    "allow_call_model_methods: mark test as allowing calls to real model implementations",
    "unit: Unit tests for individual functions",
    "integration: Integration tests requiring external services",
    "slow: Tests that take more than 5 seconds",
    "ctf: CTF-specific functionality tests",
    "agent: Agent-related tests",
    "tool: Tool-related tests",
    "security: Security and guardrail tests",
    "optional: Tests for optional dependencies",
    "e2e: End-to-end browser tests requiring Playwright",
]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[project.scripts]
kryon = "kryon.cli:main"

