[project]
name = "kryon"
version = "1.0.0"
description = "KRYON - Autonomous Cybersecurity Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "kryon-security" }]
dependencies = [
    # logging and visualization
    "folium>=0.15.0, <1",
    "matplotlib>=3.0, <4",
    "numpy>=1.21, <3",
    "pandas>=1.3, <3",
    # core skynet
    "openai==1.75.0",
    "pydantic>=2.10, <3",
    "griffe>=1.5.6, <2",
    "typing-extensions>=4.12.2, <5",
    "requests>=2.0, <3",
    "types-requests>=2.0, <3",
    # openinference moved to optional-dependencies[tracing] for Python 3.14+ compatibility
    "wasabi>=1.1.3",
    "rich>=13.9.4",
    "prompt_toolkit>=3.0.39",
    "dotenv>=0.9.9",
    "litellm[proxy]>=1.63.7",
    "mako>=1.3.8",
    "mcp; python_version >= '3.10'",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "paramiko>=3.5.1",
    "dnspython",
    "flask",
    "networkx",
    "PyPDF2",
]
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/skyvanguard/kryon"
Repository = "https://github.com/skyvanguard/kryon"

[project.optional-dependencies]
voice = ["numpy>=2.2.0, <3; python_version>='3.10'", "websockets>=15.0, <16"]
viz = ["graphviz>=0.17"]
tracing = ["openinference-instrumentation-openai>=0.1.22; python_version<'3.14'"]
rag = [
    "chromadb>=1.2.0",
    "schedule>=1.2.0",
    "sentence-transformers>=5.0.0",
]
dev = [
    "mypy",
    "ruff==0.9.2",
    "pytest",
    "pytest-asyncio",
    "pytest-mock>=3.14.0",
    "pytest-cov",
    "coverage>=7.6.12",
    "inline-snapshot>=0.20.7",
]

[dependency-groups]
dev = [
    "mypy",
    "ruff==0.9.2",
    "pytest",
    "pytest-asyncio",
    "pytest-mock>=3.14.0",
    "rich",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.28.0",
    "coverage>=7.6.12",
    "playwright==1.50.0",
    "inline-snapshot>=0.20.7",
    "pynput",
    "types-pynput",
    "sounddevice",
    "textual",
    "websockets",
    "litellm",
    "prisma",
    "graphviz",
]

[tool.uv.workspace]
members = ["agents"]

[tool.uv.sources]
agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    ".trunk/",
    ".git/",
    ".vscode/",
    ".devcontainer/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    "venv/",
    ".venv/",
    "dist/",
    "build/",
    "*.egg-info/",
    "workspaces/",
    "benchmarks/",
    "logs/",
    "site/",
    ".skynet/",
    "nohup.out",
    "ci/",
    "tools/cut_the_rope/"
]

[tool.hatch.build.targets.wheel]
packages = ["src/skynet"]
exclude = [
    ".trunk/",
    ".git/",
    ".vscode/",
    ".devcontainer/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    "venv/",
    ".venv/",
    "dist/",
    "build/",
    "*.egg-info/",
    "workspaces/",
    "benchmarks/",
    "logs/",
    "site/",
    ".skynet/",
    "nohup.out",
    "ci/",
    "tools/cut_the_rope/"
]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
exclude = [
    ".trunk/",
    ".git/",
    ".vscode/",
    ".devcontainer/",
    ".mypy_cache/",
    ".pytest_cache/",
    ".ruff_cache/",
    "venv/",
    ".venv/",
    "dist/",
    "build/",
    "*.egg-info/",
    "workspaces/",
    "benchmarks/",
    "logs/",
    "site/",
    ".skynet/",
    "nohup.out",
    "ci/",
    "tools/cut_the_rope/"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "UP007",  # Use X | Y for type unions (requires Python 3.10+ runtime)
    "UP035",  # Import from collections.abc (compatibility with older code)
    "UP045",  # Use X | None instead of Optional[X] (requires Python 3.10+ runtime)
    "B905",   # zip() without strict= (added in Python 3.10)
]
isort = { combine-as-imports = true, known-first-party = ["agents"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E501"]
"tests/**/*.py" = ["E501", "E402", "F401"]
# Files with mathematical formulas/long docstrings
"src/skynet/agents/*.py" = ["E501"]
# Files with security tool documentation
"src/skynet/tools/**/*.py" = ["E501"]
# Files with UI strings and long messages
"src/skynet/repl/**/*.py" = ["E501"]
"src/skynet/sdk/**/*.py" = ["E501", "E402"]
"src/skynet/knowledge/**/*.py" = ["E501"]
# Files with intentional late imports (warning config, circular import avoidance)
"src/skynet/cli.py" = ["E402"]
"src/skynet/util_legacy.py" = ["E402"]
"src/skynet/agents/hk_aerial.py" = ["E402"]
"src/skynet/agents/patterns/__init__.py" = ["E402"]

[tool.mypy]
strict = false
warn_return_any = false
warn_unused_ignores = false
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
no_implicit_optional = false

[[tool.mypy.overrides]]
module = "sounddevice.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "skynet.tools.*",
    "skynet.agents.*",
    "skynet.knowledge.*",
    "skynet.repl.*",
    "skynet.cache.*",
    "skynet.cli",
    "skynet.sdk.agents.global_usage_tracker",
    "skynet.sdk.agents.voice.*",
    "skynet.sdk.agents.models.openai_chatcompletions",
    "skynet.sdk.agents.models.openai_responses",
    "skynet.sdk.agents.mcp.*",
    "skynet.sdk.agents._run_impl",
    "skynet.sdk.agents.run",
    "skynet.sdk.agents.run_to_jsonl",
    "skynet.sdk.agents.parallel_tool_executor",
]
ignore_errors = true

[tool.coverage.run]
source = ["tests", "src/skynet/sdk/agents"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"
exclude_also = [
    # This is only executed while typechecking
    "if TYPE_CHECKING:",
    "@abc.abstractmethod",
    "raise NotImplementedError",
    "logger.debug",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    # This is a warning that is expected to happen: we have an async filter that raises an exception
    "ignore:coroutine 'test_async_input_filter_fails.<locals>.invalid_input_filter' was never awaited:RuntimeWarning",
]
markers = [
    "allow_call_model_methods: mark test as allowing calls to real model implementations",
]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[project.scripts]
kryon = "skynet.cli:main"
skynet = "skynet.cli:main"  # Legacy alias for backwards compatibility
