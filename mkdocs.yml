site_name: SKYNET - AI-Powered Pentesting Framework
site_description: Advanced autonomous penetration testing system with multi-agent architecture and RAG knowledge base
site_author: SKYNET Development Team
site_url: https://skynet-docs.io

# Repository
repo_name: skynet-ai/skynet
repo_url: https://github.com/skynet-ai/skynet
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 SKYNET Project - Omega-Strategic Clearance

theme:
  name: material
  features:
    # Allows copying code blocks
    - content.code.copy
    # Allows selecting code blocks
    - content.code.select
    # Shows the current path in the sidebar
    - navigation.path
    # Shows sections in the sidebar
    - navigation.sections
    # Shows sections expanded by default
    - navigation.expand
    # Enables annotations in code blocks
    - content.code.annotate
    # Navigation tabs at top
    - navigation.tabs
    - navigation.tabs.sticky
    # Table of contents integration
    - toc.follow
    - toc.integrate
    # Search enhancements
    - search.suggest
    - search.highlight
    - search.share
    # Navigation enhancements
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    # Content features
    - content.tabs.link
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: assets/imago.png
  favicon: assets/imago.png
  font:
    text: Roboto
    code: Roboto Mono
