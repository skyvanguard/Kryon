# Intentionally vulnerable nginx config. Planted issues:
#   - HTTP only (no HTTPS)                       CWE-319 / CWE-1004
#   - Server tokens exposed                      CWE-200
#   - /admin accessible without auth             CWE-306
#   - Session cookie without Secure / HttpOnly   CWE-1004

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens on;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Set-Cookie "SESSIONID=demo-session-123; Path=/";
    }

    location /admin {
        root /usr/share/nginx/html;
        try_files /admin.html =404;
        # No auth_basic — intentionally open for the demo.
    }
}
