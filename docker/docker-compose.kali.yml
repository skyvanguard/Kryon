# =============================================================================
# KRYON - Kali Linux Pentesting Stack
# =============================================================================
# Full offensive security environment with local LLM (llama.cpp + GPU).
#
# Usage:
#   docker compose -f docker/docker-compose.kali.yml build
#   docker compose -f docker/docker-compose.kali.yml up -d
#   docker compose -f docker/docker-compose.kali.yml --profile proxy up -d
#
# Interactive:
#   docker exec -it kryon python -m kryon          # REPL
#   docker exec -it kryon bash                     # Kali shell
#   docker exec -it -u root kryon bash             # Root shell (VPN, etc.)
#   curl http://localhost:8081/v1/models           # llama-server (LLM principal)
#
# VPN for CTFs:
#   docker exec -u root -d kryon openvpn --config /workspace/htb.ovpn
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Kryon — Kali Linux pentesting platform
  # ---------------------------------------------------------------------------
  kryon:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kali
    container_name: kryon
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env.docker
    environment:
      # LLM principal: llama.cpp (llama-server) con kryon-devstral-24b (Devstral, dense).
      # NOTA: este bloque environment PISA a env_file (.env.docker) para
      # estas vars — los defaults de acá son la fuente de verdad efectiva.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-llama}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://llama-server:8080/v1}
      # Modo LLM local (parsers robustos + usage patch). Reemplaza al flag OLLAMA.
      - KRYON_LOCAL_LLM=${KRYON_LOCAL_LLM:-true}
      - KRYON_MODEL=${KRYON_MODEL:-kryon-devstral-24b}
      # Modelos locales necesitan forzar tool-calling los primeros N turnos.
      - KRYON_FORCE_TOOL_TURNS=${KRYON_FORCE_TOOL_TURNS:-8}
      - KRYON_DEBUG=${KRYON_DEBUG:-0}
      - KRYON_GUARDRAILS=${KRYON_GUARDRAILS:-true}
      - KRYON_MAX_TURNS=${KRYON_MAX_TURNS:-50}
      - KRYON_STREAM=${KRYON_STREAM:-false}
      # Sub-agent delegation (Phase 1): when true, the unified agent gets a
      # focused SAST specialist it can delegate to via as_tool (isolated
      # context). Off by default — banca-safe; off == prior behavior.
      - KRYON_SUBAGENTS=${KRYON_SUBAGENTS:-false}
      # Reasoning effort (F184: low|medium|high). gpt-oss reads it (Harmony
      # "Reasoning:" directive). Empty = model default. medium+ without active
      # pre_hooks can cause CoT loops — measure before defaulting it on.
      - KRYON_REASONING_EFFORT=${KRYON_REASONING_EFFORT:-}
      # RAG apagado — auto-updater desactivado (ya no se siembra el corpus).
      - KRYON_AUTO_UPDATE=${KRYON_AUTO_UPDATE:-false}
      # Claude Code CLI backend — configured in .env.docker
      # KRYON_CLAUDE_CODE and KRYON_CLAUDE_MODEL come from env_file
    volumes:
      - kryon-workspace:/workspace
      - kryon-logs:/logs
      - kryon-config:/home/kryon/.kryon
      - kryon-knowledge:/home/kryon/.config/chromadb
      - kryon-cache:/home/kryon/.cache
      - kryon-reports:/reports
      # Mount host Claude auth for CLI backend
      - ${HOME}/.claude:/home/kryon/.claude
      - ${HOME}/.claude.json:/home/kryon/.claude.json
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
        reservations:
          cpus: "2"
          memory: 3G
    ports:
      - "127.0.0.1:8700:8700"
    cap_add:
      - NET_RAW
      - NET_ADMIN
      # FASE 11.O.5 — py-spy needs ptrace to attach to running PIDs
      # for live stack-trace dumps when the agent hangs in CPU loop.
      # Diagnostic-only; banca-safe (no privilege escalation surface
      # beyond what ptrace already provides; same process tree).
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - kryon-mgmt
      - kryon-pentest
    depends_on:
      llama-server:
        condition: service_started
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # llama-server — LLM principal (llama.cpp) — reemplaza a Ollama para inferencia
  # ---------------------------------------------------------------------------
  # Sirve el MoE Qwen3.6-35B-A3B (UD-Q4_K_XL) con expertos en CPU/RAM
  # (--n-cpu-moe 99) y attention en GPU (-ngl 99): ~3.4 GB VRAM. --jinja
  # habilita tool-calling OpenAI-compat (validado Fase 0).
  #
  # IMPORTANTE — VRAM 12 GB: solo UN llama-server a la vez. Si corrés el
  # contenedor externo `hermes-llamacpp` (otro proyecto, mismo GGUF), pará
  # uno de los dos o habrá OOM.
  #
  # El GGUF (21 GB) se reusa del volume externo `hermes-llamacpp-cache`
  # (montado read-only) para no re-descargar.
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: kryon-llama
    restart: unless-stopped
    command:
      - -m
      # Devstral-Small-2-24B (Mistral, IQ3_XXS, 8.8 GB) — tool-use specialist.
      # 24B dense does NOT fit in 12 GB with f16 KV at useful context, so the KV
      # cache is quantized to q8_0 (below, practically lossless with -fa): that
      # halves KV VRAM and lets -c reach 24576 (24K) at ~11.7/12 GB — enough for
      # the unified agent's ~10K system prompt + multi-turn SAST (verified: it
      # found JNDI/OGNL sinks live; emits native tool_calls; responds to the
      # StuckDetector instead of looping). Served under the "kryon-devstral-24b" alias
      # so the rest of the stack is unchanged. To go back to the faster (but
      # shallower) dense 8B, flip -m to /models/qwen3-8b-q4km.gguf, drop the
      # --cache-type-k/v lines, set -c 32768 and re-add --reasoning-budget 0.
      # SWAP TEST (Qwen3.5-9B Q8_0, salió 2026-03): 9B denso, full GPU, tool_calls.
      # Revertir: comentar la línea Qwen + descomentar la Devstral.
      # - /models/Devstral-Small-2-24B-IQ3_XXS.gguf
      - /models/Qwen3.5-9B-Q8_0.gguf
      - -ngl
      - "99"
      - -fa
      - "on"
      # KV cache q8_0 — ~50% menos VRAM del KV (practically lossless con -fa).
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      # 16K context — the SWEET SPOT, not 24K. Measured on the RTX 5070 Ti Laptop
      # (12 GB): at -c 24576 the KV cache fills VRAM (11.5/12 GB) and llama.cpp
      # falls back to a slow path → ~3 tok/s (engagements crawl). At -c 16384 the
      # model sits at 11.35/12 GB (just under that threshold) and still does ~40
      # tok/s — same IQ3 quality (no requant). NB: 16K was 60 tokens short — the
      # ~10K system prompt + injected deterministic findings reach ~16.4K BEFORE
      # the agent acts (micro_compact F-CTXMGMT trims history, not the prompt). 20K
      # covers prompt+findings + trimmed history; more headroom → shrink the prompt.
      - -c
      # Qwen3.5-9B Q8 (9.1GB) KV cache ~16 MiB/1K tokens (atención eficiente). 131072 (128K)
      # mide ~11.2GB/12GB (~1GB margen). Techo VRAM ~160K; nativo 262K. 20480 para Devstral.
      - "131072"
      # Generation cap — bounds a verbose CoT turn + stops history snowballing.
      - -n
      - "2000"
      # Qwen3.5 NON-THINKING sampling (temp 0.7 / top_p 0.8 / top_k 20). ROOT-CAUSE FIX: the
      # thinking output (a <think> block parsed into reasoning_content with EMPTY content) reads
      # as a reasoning-only dud in our llama.cpp+SDK harness, which killed every live run this
      # session (Qwen scores 79.1% on TAU2-Bench under its OWN vLLM parser, but ours mishandles
      # the thinking format). The temp-1.0 thinking sampling made it WORSE (more/longer reasoning
      # → more duds). Disabling thinking (--chat-template-kwargs enable_thinking=false) makes it
      # emit content/tool_calls directly — the deterministic chain-planner compensates for the
      # slightly weaker per-step reasoning. Revert to temp 0.15 for banking-safe compliance runs.
      - --chat-template-kwargs
      - '{"enable_thinking": false}'
      - --temp
      - "0.7"
      - --top-p
      - "0.8"
      - --top-k
      - "20"
      - --parallel
      - "1"
      # -t 8: usar SOLO los 8 P-cores del Core Ultra 9 275HX (hibrido 8P+16E).
      # Sin esto llama.cpp usa los 24 threads (incluidos E-cores) y la generacion
      # con --n-cpu-moe (modelos MoE: gpt-oss-20b, qwen36-35b) cae ~10x
      # (~38 -> ~3.5 tok/s). Verificado 2026-06-10 con el coder-30B. Inocuo para
      # el 8B denso (GPU-bound), critico al flipear a un MoE.
      - -t
      - "8"
      - --jinja
      - -a
      - kryon-devstral-24b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - hermes-llamacpp-cache:/models:ro
    # Puerto host 8081 para CLI/debug (hermes-llamacpp ocupa 8080 en el host).
    # Kryon lo alcanza por red interna: http://llama-server:8080/v1
    ports:
      - "127.0.0.1:${LLAMA_HOST_PORT:-8081}:8080"
    deploy:
      resources:
        limits:
          memory: 12G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - kryon-mgmt

  # ---------------------------------------------------------------------------
  # Dashboard — Next.js 16 web UI for the platform
  # ---------------------------------------------------------------------------
  # Served on http://localhost:3000 by default. Talks to the Kryon FastAPI
  # backend by service name (http://kryon:8000) over the mgmt network.
  # When NEXT_PUBLIC_KRYON_API_URL is empty the dashboard renders in demo
  # mode with deterministic mock data — useful for UI-only testing or when
  # the engine is being rebuilt.
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: kryon-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Point at the Kryon FastAPI service. Leave empty to force demo mode.
      - NEXT_PUBLIC_KRYON_API_URL=${KRYON_API_URL:-http://kryon:8000}
      - NEXT_PUBLIC_KRYON_API_KEY=${KRYON_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - kryon-mgmt
    depends_on:
      kryon:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy with TLS (optional, enable with --profile proxy)
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    container_name: kryon-nginx
    profiles:
      - proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - kryon
    networks:
      - kryon-mgmt

# =============================================================================
# Volumes
# =============================================================================
volumes:
  kryon-workspace:
    driver: local
  kryon-logs:
    driver: local
  kryon-config:
    driver: local
  kryon-knowledge:
    driver: local
  kryon-reports:
    driver: local
  kryon-cache:
    driver: local
  # GGUF del MoE (21 GB) — creado por el contenedor externo hermes-llamacpp
  # (docker run). Se reusa read-only para no re-descargar.
  hermes-llamacpp-cache:
    external: true

# =============================================================================
# Networks
# =============================================================================
# mgmt:    Kryon <-> llama-server (internal comms)
# pentest: Kryon <-> targets (isolated, no LLM access)
# =============================================================================
networks:
  kryon-mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  kryon-pentest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
