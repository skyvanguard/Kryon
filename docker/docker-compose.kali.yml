# =============================================================================
# KRYON - Kali Linux Pentesting Stack
# =============================================================================
# Full offensive security environment with local LLM (Ollama + GPU).
#
# Usage:
#   docker compose -f docker/docker-compose.kali.yml build
#   docker compose -f docker/docker-compose.kali.yml up -d
#   docker compose -f docker/docker-compose.kali.yml --profile proxy up -d
#
# Interactive:
#   docker exec -it kryon python -m kryon          # REPL
#   docker exec -it kryon bash                     # Kali shell
#   docker exec -it -u root kryon bash             # Root shell (VPN, etc.)
#   docker exec -it kryon-ollama ollama pull dolphin-mistral:7b
#
# VPN for CTFs:
#   docker exec -u root -d kryon openvpn --config /workspace/htb.ovpn
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Kryon — Kali Linux pentesting platform
  # ---------------------------------------------------------------------------
  kryon:
    build:
      context: ..
      dockerfile: docker/Dockerfile.kali
    container_name: kryon
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env.docker
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://ollama:11434/v1}
      - OLLAMA=${OLLAMA:-true}
      - KRYON_MODEL=${KRYON_MODEL:-kryon-14b}
      - KRYON_DEBUG=${KRYON_DEBUG:-0}
      - KRYON_GUARDRAILS=${KRYON_GUARDRAILS:-true}
      - KRYON_MAX_TURNS=${KRYON_MAX_TURNS:-50}
      - KRYON_STREAM=${KRYON_STREAM:-false}
      # Knowledge auto-updater (seeds NVD, ExploitDB, GitHub daily)
      - KRYON_AUTO_UPDATE=${KRYON_AUTO_UPDATE:-true}
      # Claude Code CLI backend — configured in .env.docker
      # KRYON_CLAUDE_CODE and KRYON_CLAUDE_MODEL come from env_file
    volumes:
      - kryon-workspace:/workspace
      - kryon-logs:/logs
      - kryon-config:/home/kryon/.kryon
      - kryon-knowledge:/home/kryon/.config/chromadb
      - kryon-cache:/home/kryon/.cache
      - kryon-reports:/reports
      # Mount host Claude auth for CLI backend
      - ${HOME}/.claude:/home/kryon/.claude
      - ${HOME}/.claude.json:/home/kryon/.claude.json
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G
        reservations:
          cpus: "2"
          memory: 3G
    ports:
      - "127.0.0.1:8700:8700"
    cap_add:
      - NET_RAW
      - NET_ADMIN
      # FASE 11.O.5 — py-spy needs ptrace to attach to running PIDs
      # for live stack-trace dumps when the agent hangs in CPU loop.
      # Diagnostic-only; banca-safe (no privilege escalation surface
      # beyond what ptrace already provides; same process tree).
      - SYS_PTRACE
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - kryon-mgmt
      - kryon-pentest
    depends_on:
      ollama:
        condition: service_started
    stdin_open: true
    tty: true

  # ---------------------------------------------------------------------------
  # Ollama — Local LLM with GPU passthrough
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: kryon-ollama
    restart: unless-stopped
    environment:
      # F203.AW — keep model loaded indefinidamente para evitar
      # cold-start de 30-60s entre bench targets. Default ollama 5min
      # causaba kryon_timeout en HTB n=7 cuando el restart del kryon
      # container desalojaba gpt-oss del GPU.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
    volumes:
      - ollama-models:/root/.ollama
    # Expose to host for CLI access (use 11435 if host Ollama occupies 11434)
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - kryon-mgmt

  # ---------------------------------------------------------------------------
  # Dashboard — Next.js 16 web UI for the platform
  # ---------------------------------------------------------------------------
  # Served on http://localhost:3000 by default. Talks to the Kryon FastAPI
  # backend by service name (http://kryon:8000) over the mgmt network.
  # When NEXT_PUBLIC_KRYON_API_URL is empty the dashboard renders in demo
  # mode with deterministic mock data — useful for UI-only testing or when
  # the engine is being rebuilt.
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: kryon-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Point at the Kryon FastAPI service. Leave empty to force demo mode.
      - NEXT_PUBLIC_KRYON_API_URL=${KRYON_API_URL:-http://kryon:8000}
      - NEXT_PUBLIC_KRYON_API_KEY=${KRYON_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    networks:
      - kryon-mgmt
    depends_on:
      kryon:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Nginx — Reverse proxy with TLS (optional, enable with --profile proxy)
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    container_name: kryon-nginx
    profiles:
      - proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - kryon
    networks:
      - kryon-mgmt

# =============================================================================
# Volumes
# =============================================================================
volumes:
  kryon-workspace:
    driver: local
  kryon-logs:
    driver: local
  kryon-config:
    driver: local
  kryon-knowledge:
    driver: local
  kryon-reports:
    driver: local
  kryon-cache:
    driver: local
  ollama-models:
    driver: local

# =============================================================================
# Networks
# =============================================================================
# mgmt:    Kryon <-> Ollama (internal comms)
# pentest: Kryon <-> targets (isolated, no LLM access)
# =============================================================================
networks:
  kryon-mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
  kryon-pentest:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
