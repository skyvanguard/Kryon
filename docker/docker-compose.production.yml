# =============================================================================
# KRYON - Production Docker Compose
# =============================================================================
# Usage:
#   docker compose -f docker/docker-compose.production.yml up -d
#   docker compose -f docker/docker-compose.production.yml --profile rag up -d
# =============================================================================

services:
  kryon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        INSTALL_SECURITY_TOOLS: "true"
    container_name: kryon
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - KRYON_DEBUG=${KRYON_DEBUG:-0}
      - KRYON_MODEL=${KRYON_MODEL:-gpt-4o}
      - KRYON_AGENT=${KRYON_AGENT:-recon_scout}
      - KRYON_TRACING=${KRYON_TRACING:-false}
      - KRYON_GUARDRAILS=${KRYON_GUARDRAILS:-true}
      - KRYON_MAX_TURNS=${KRYON_MAX_TURNS:-inf}
      - KRYON_PARALLEL=${KRYON_PARALLEL:-1}
      - KRYON_PRICE_LIMIT=${KRYON_PRICE_LIMIT:-inf}
    volumes:
      - kryon-workspace:/workspace
      - kryon-logs:/logs
      - kryon-config:/home/kryon/.kryon
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G
    networks:
      - kryon-net
    stdin_open: true
    tty: true

  # ChromaDB for RAG functionality (optional, enable with --profile rag)
  chromadb:
    image: chromadb/chroma:latest
    container_name: kryon-chromadb
    profiles:
      - rag
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    networks:
      - kryon-net

volumes:
  kryon-workspace:
    driver: local
  kryon-logs:
    driver: local
  kryon-config:
    driver: local
  chromadb-data:
    driver: local

networks:
  kryon-net:
    driver: bridge
