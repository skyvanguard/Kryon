server {
    listen 8006 ssl;
    server_name _;

    ssl_certificate     /etc/pve/local/pve-ssl.pem;
    ssl_certificate_key /etc/pve/local/pve-ssl.key;

    # /api2/json/version is the only endpoint Proxmox exposes without auth
    location = /api2/json/version {
        default_type application/json;
        return 200 '{"data":{"version":"7.2-3","release":"7.2","repoid":"c743d6c1"}}';
    }

    # every privileged endpoint returns 401 (correct behaviour — PVE-1.2 PASS)
    location /api2/json/nodes            { return 401; }
    location /api2/json/cluster/status   { return 401; }
    location /api2/json/access/domains   { return 401; }
    location /api2/json/access/users     { return 401; }

    # UI placeholder
    location / {
        default_type text/html;
        return 200 '<html><body>Fake Proxmox VE node — demo only.</body></html>';
    }
}
