cwe: CWE-121
name: Stack-Based Buffer Overflow
aliases: [CWE-787, CWE-119]
detection:
  - regex: "\\bchar\\s+\\w+\\[\\d+\\]\\s*;[^;]*?\\bstrcpy\\s*\\("
    confidence: high
  - regex: "\\bchar\\s+\\w+\\[\\d+\\][^;]*?\\bgets\\s*\\("
    confidence: high
  - regex: "\\bwchar_t\\s+\\w+\\[\\d+\\][^;]*?\\bwcscpy\\s*\\("
    confidence: high
  - regex: "\\b(?:ALLOCA|alloca)\\s*\\("
    confidence: medium
  - regex: "\\bstrcpy\\s*\\(\\s*\\w+\\s*,"
    confidence: medium
  # F6.5 round 2: Juliet's wchar_t/memcpy variant —
  #   memcpy(data, source, (wcslen(source) + 1) * sizeof(wchar_t))
  - regex: "\\bmemcpy\\s*\\([^,]+,[^,]+,[^)]*\\bsizeof\\s*\\([^)]*wchar_t"
    confidence: high
  - regex: "\\bmemcpy\\s*\\([^,]+,[^,]+,[^)]*\\bwcslen\\s*\\("
    confidence: high
  # data points to small buffer + memcpy with calculated size
  - regex: "\\b(\\w+)\\s*=\\s*\\w+(?:Bad|Small|Tiny)Buffer\\s*;[\\s\\S]{0,300}?memcpy\\s*\\(\\s*\\1"
    confidence: high
verification:
  poc_skeleton: |
    #include <string.h>
    int main(void) {
        char buf[16];
        strcpy(buf, "AAAAAAAAAAAAAAAAAAAAAAAAAA");
        return buf[0];
    }
  asan_class: stack-buffer-overflow
escalation_hints:
  - "Stack overflow can overwrite saved return address -> arbitrary code execution"
  - "Even with stack canaries, large overflows defeat them"
fpr_filters:
  - skip_if_source_is_string_literal
  - skip_if_dest_is_dynamic_alloc
