cwe: CWE-787
name: Out-of-bounds Write
aliases: [CWE-121, CWE-122, CWE-124, CWE-119, CWE-676]
detection:
  - regex: "\\bstrcpy\\s*\\("
    confidence: high
  - regex: "\\bstrcat\\s*\\("
    confidence: high
  - regex: "\\bsprintf\\s*\\("
    confidence: high
  - regex: "\\bgets\\s*\\("
    confidence: high
  - regex: "\\bvsprintf\\s*\\("
    confidence: high
  - regex: "\\bmemcpy\\s*\\([^,]+,[^,]+,\\s*\\w+\\s*[+*]\\s*\\w+"
    confidence: medium
  - regex: "\\bwcscpy\\s*\\("
    confidence: high
  - regex: "\\bwcsncpy\\s*\\("
    confidence: medium
verification:
  poc_skeleton: |
    #include <stdlib.h>
    #include <string.h>
    int main(void) {
        char *p = malloc(8);
        memcpy(p, "AAAAAAAAAAAAAAAAAAAAAAAAA", 25);
        return p[0];
    }
  asan_class: heap-buffer-overflow
escalation_hints:
  - "If write reaches function pointers or vtables -> control-flow hijack potential"
  - "If write overlaps heap metadata -> arbitrary write primitive possible"
fpr_filters:
  - skip_if_source_is_string_literal
  - skip_if_size_is_sizeof_dest
