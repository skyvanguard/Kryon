cwe: CWE-416
name: Use After Free
aliases: [CWE-672]
detection:
  - regex: "\\bfree\\s*\\(\\s*(\\w+)\\s*\\)\\s*;[\\s\\S]{0,400}?\\1\\s*->"
    confidence: high
  - regex: "\\bfree\\s*\\(\\s*(\\w+)\\s*\\)\\s*;[\\s\\S]{0,400}?\\*\\1"
    confidence: high
  - regex: "\\bfree\\s*\\(\\s*(\\w+)\\s*\\)\\s*;[\\s\\S]{0,400}?\\b\\1\\s*\\["
    confidence: medium
  - regex: "\\bfree\\s*\\(\\s*(\\w+)\\s*\\)\\s*;[\\s\\S]{0,200}?(?:strcpy|memcpy|strcat)\\s*\\([^,]*\\1"
    confidence: high
  - regex: "\\bfclose\\s*\\(\\s*(\\w+)\\s*\\)\\s*;[\\s\\S]{0,200}?\\bf(?:read|write|gets|printf|seek|tell)\\s*\\([^)]*\\1"
    confidence: medium
verification:
  poc_skeleton: |
    #include <stdlib.h>
    #include <string.h>
    int main(void) {
        char *p = malloc(16);
        strcpy(p, "hello");
        free(p);
        return p[0];
    }
  asan_class: heap-use-after-free
escalation_hints:
  - "UAF read leaks heap layout/contents -> info disclosure"
  - "UAF write into reallocated chunk with different type -> type confusion -> RCE potential"
  - "If freed object is in a kernel allocator with controlled re-allocation -> kernel exploit"
fpr_filters:
  - skip_if_pointer_reassigned_after_free
  - skip_if_inside_branch_not_taken
