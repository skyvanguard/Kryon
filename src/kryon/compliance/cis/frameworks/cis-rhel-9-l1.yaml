# ---------------------------------------------------------------------------
# CIS Red Hat Enterprise Linux 9 Benchmark — Level 1 Server (F35)
# ---------------------------------------------------------------------------
# RHEL 9 deltas from Debian/Ubuntu: dnf (not apt), firewalld (not ufw),
# SELinux (not AppArmor), /etc/redhat-release, audit.d default config,
# systemd service names (sshd not ssh), usermod -p convention.
#
# Applies also to compatible clones: CentOS Stream 9, Rocky Linux 9,
# AlmaLinux 9 (same RPM ecosystem).
# ---------------------------------------------------------------------------

framework:
  id: cis-rhel-9-l1
  title: "CIS Red Hat Enterprise Linux 9 Benchmark — Level 1 Server"
  version: "0.1.0"
  source: "CIS RHEL 9 Benchmark v2.0.0 (covers Rocky 9, Alma 9, CentOS Stream 9)"
  description: >
    Level-1 Server hardening for RHEL 9 and compatibles. Assumes dnf +
    firewalld + SELinux + auditd. 60 checks covering all major sections.

checks:
  # =========================================================================
  # SECTION 1 — Initial Setup
  # =========================================================================
  - id: CIS-RHEL-1.1.1
    title: "Ensure SELinux is installed"
    section: "1.1"
    severity: HIGH
    remediation: "dnf install -y libselinux selinux-policy-targeted"
    command: "rpm -q libselinux selinux-policy-targeted 2>/dev/null | grep -vc 'not installed' || echo 0"
    pass_when:
      stdout_matches: "^2\\s*$"

  - id: CIS-RHEL-1.1.2
    title: "Ensure SELinux is enforcing (not permissive/disabled)"
    section: "1.1"
    severity: CRITICAL
    remediation: "setenforce 1; set SELINUX=enforcing in /etc/selinux/config"
    command: "getenforce 2>/dev/null"
    pass_when:
      stdout_matches: "^Enforcing"

  - id: CIS-RHEL-1.1.3
    title: "Ensure no unconfined SELinux processes"
    section: "1.1"
    severity: MEDIUM
    remediation: "Investigate: ps -eZ | grep -v '^system_u\\|^unconfined_u:object_r' | wc -l"
    command: "ps -eZ 2>/dev/null | grep -c 'unconfined_service_t\\|unconfined_t' || echo 0"
    pass_when:
      stdout_matches: "^[0-9]\\s*$|^[01][0-9]\\s*$"

  - id: CIS-RHEL-1.2.1
    title: "Ensure GPG keys are configured"
    section: "1.2"
    severity: MEDIUM
    remediation: "rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release"
    command: "rpm -q gpg-pubkey --qf '%{NAME}-%{VERSION}-%{RELEASE}\\n' 2>/dev/null | wc -l"
    pass_when:
      not:
        stdout_matches: "^0\\s*$"

  - id: CIS-RHEL-1.2.2
    title: "Ensure gpgcheck globally enabled in dnf"
    section: "1.2"
    severity: HIGH
    remediation: "Set gpgcheck=1 in /etc/dnf/dnf.conf and every /etc/yum.repos.d/*.repo"
    command: "grep -E '^gpgcheck' /etc/dnf/dnf.conf 2>/dev/null || true"
    pass_when:
      stdout_matches: "gpgcheck\\s*=\\s*1"

  - id: CIS-RHEL-1.3.1
    title: "Ensure AIDE is installed"
    section: "1.3"
    severity: MEDIUM
    remediation: "dnf install -y aide && aide --init && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz"
    command: "rpm -q aide 2>/dev/null | grep -v 'not installed' | head -1 || echo 'not installed'"
    pass_when:
      not:
        stdout_contains: "not installed"

  - id: CIS-RHEL-1.4.1
    title: "Ensure GRUB2 password is set"
    section: "1.4"
    severity: MEDIUM
    remediation: "grub2-setpassword; regenerate grub.cfg"
    command: "grep -iE '^GRUB2?_PASSWORD|^password' /etc/grub.d/* /boot/grub2/user.cfg 2>/dev/null || true"
    pass_when:
      not:
        stdout_empty: true

  - id: CIS-RHEL-1.5.1
    title: "Ensure core dumps are restricted"
    section: "1.5"
    severity: MEDIUM
    remediation: "sysctl -w fs.suid_dumpable=0; echo 'fs.suid_dumpable=0' >> /etc/sysctl.d/50-cis.conf"
    command: "sysctl fs.suid_dumpable 2>/dev/null"
    pass_when:
      stdout_matches: "fs\\.suid_dumpable\\s*=\\s*0"

  # =========================================================================
  # SECTION 2 — Services
  # =========================================================================
  - id: CIS-RHEL-2.1.1
    title: "Ensure chronyd is installed and active"
    section: "2.1"
    severity: MEDIUM
    remediation: "dnf install -y chrony && systemctl enable --now chronyd"
    command: "systemctl is-active chronyd 2>/dev/null"
    pass_when:
      stdout_matches: "^active"

  - id: CIS-RHEL-2.2.1
    title: "Ensure telnet-server is not installed"
    section: "2.2"
    severity: HIGH
    remediation: "dnf remove -y telnet-server"
    command: "rpm -q telnet-server 2>/dev/null | grep -v 'not installed' | head -1 || echo 'not installed'"
    pass_when:
      stdout_contains: "not installed"

  - id: CIS-RHEL-2.2.2
    title: "Ensure rsh-server is not installed"
    section: "2.2"
    severity: HIGH
    remediation: "dnf remove -y rsh-server"
    command: "rpm -q rsh-server 2>/dev/null | grep -v 'not installed' | head -1 || echo 'not installed'"
    pass_when:
      stdout_contains: "not installed"

  - id: CIS-RHEL-2.2.3
    title: "Ensure Avahi is not installed"
    section: "2.2"
    severity: LOW
    remediation: "dnf remove -y avahi avahi-autoipd"
    command: "rpm -q avahi 2>/dev/null | grep -v 'not installed' | head -1 || echo 'not installed'"
    pass_when:
      stdout_contains: "not installed"

  - id: CIS-RHEL-2.2.4
    title: "Ensure CUPS is not installed"
    section: "2.2"
    severity: LOW
    remediation: "dnf remove -y cups"
    command: "rpm -q cups 2>/dev/null | grep -v 'not installed' | head -1 || echo 'not installed'"
    pass_when:
      stdout_contains: "not installed"

  - id: CIS-RHEL-2.2.5
    title: "Ensure DHCP server is not installed"
    section: "2.2"
    severity: MEDIUM
    remediation: "dnf remove -y dhcp-server"
    command: "rpm -q dhcp-server 2>/dev/null | grep -v 'not installed' | head -1 || echo 'not installed'"
    pass_when:
      stdout_contains: "not installed"

  - id: CIS-RHEL-2.2.6
    title: "Ensure telnet client is not installed"
    section: "2.2"
    severity: HIGH
    remediation: "dnf remove -y telnet"
    command: "rpm -q telnet 2>/dev/null | grep -v 'not installed' | head -1 || echo 'not installed'"
    pass_when:
      stdout_contains: "not installed"

  # =========================================================================
  # SECTION 3 — Network Configuration
  # =========================================================================
  - id: CIS-RHEL-3.1.1
    title: "Ensure IPv4 forwarding is disabled"
    section: "3.1"
    severity: MEDIUM
    remediation: "sysctl -w net.ipv4.ip_forward=0"
    command: "sysctl net.ipv4.ip_forward 2>/dev/null"
    pass_when:
      stdout_matches: "net\\.ipv4\\.ip_forward\\s*=\\s*0"

  - id: CIS-RHEL-3.1.2
    title: "Ensure ICMP redirects are not accepted"
    section: "3.1"
    severity: MEDIUM
    remediation: "sysctl -w net.ipv4.conf.all.accept_redirects=0"
    command: "sysctl net.ipv4.conf.all.accept_redirects 2>/dev/null"
    pass_when:
      stdout_matches: "accept_redirects\\s*=\\s*0"

  - id: CIS-RHEL-3.1.3
    title: "Ensure source-routed packets are not accepted"
    section: "3.1"
    severity: MEDIUM
    remediation: "sysctl -w net.ipv4.conf.all.accept_source_route=0"
    command: "sysctl net.ipv4.conf.all.accept_source_route 2>/dev/null"
    pass_when:
      stdout_matches: "accept_source_route\\s*=\\s*0"

  - id: CIS-RHEL-3.1.4
    title: "Ensure TCP SYN Cookies are enabled"
    section: "3.1"
    severity: MEDIUM
    remediation: "sysctl -w net.ipv4.tcp_syncookies=1"
    command: "sysctl net.ipv4.tcp_syncookies 2>/dev/null"
    pass_when:
      stdout_matches: "tcp_syncookies\\s*=\\s*1"

  - id: CIS-RHEL-3.2.1
    title: "Ensure suspicious packets are logged (rp_filter)"
    section: "3.2"
    severity: LOW
    remediation: "sysctl -w net.ipv4.conf.all.rp_filter=1"
    command: "sysctl net.ipv4.conf.all.rp_filter 2>/dev/null"
    pass_when:
      stdout_matches: "rp_filter\\s*=\\s*[12]"

  - id: CIS-RHEL-3.5.1
    title: "Ensure firewalld is installed and active"
    section: "3.5"
    severity: HIGH
    remediation: "dnf install -y firewalld; systemctl enable --now firewalld"
    command: "systemctl is-active firewalld 2>/dev/null"
    pass_when:
      stdout_matches: "^active"

  - id: CIS-RHEL-3.5.2
    title: "Ensure firewalld default zone is set (not public with no restrictions)"
    section: "3.5"
    severity: MEDIUM
    remediation: "firewall-cmd --set-default-zone=<appropriate-zone>"
    command: "firewall-cmd --get-default-zone 2>/dev/null || true"
    pass_when:
      not:
        stdout_empty: true

  # =========================================================================
  # SECTION 4 — Logging and Auditing
  # =========================================================================
  - id: CIS-RHEL-4.1.1.1
    title: "Ensure auditd is installed"
    section: "4.1.1"
    severity: HIGH
    remediation: "dnf install -y audit audit-libs; systemctl enable --now auditd"
    command: "rpm -q audit 2>/dev/null | grep -v 'not installed' | head -1 || echo 'not installed'"
    pass_when:
      not:
        stdout_contains: "not installed"

  - id: CIS-RHEL-4.1.1.2
    title: "Ensure auditd service is active"
    section: "4.1.1"
    severity: HIGH
    remediation: "systemctl enable --now auditd"
    command: "systemctl is-active auditd 2>/dev/null"
    pass_when:
      stdout_matches: "^active"

  - id: CIS-RHEL-4.1.1.3
    title: "Ensure audit=1 in kernel cmdline"
    section: "4.1.1"
    severity: MEDIUM
    remediation: "grubby --update-kernel=ALL --args='audit=1'"
    command: "grep -E 'audit=1' /proc/cmdline 2>/dev/null || true"
    pass_when:
      stdout_contains: "audit=1"

  - id: CIS-RHEL-4.1.1.4
    title: "Ensure audit_backlog_limit is sufficient"
    section: "4.1.1"
    severity: LOW
    remediation: "grubby --update-kernel=ALL --args='audit_backlog_limit=8192'"
    command: "grep -oE 'audit_backlog_limit=[0-9]+' /proc/cmdline 2>/dev/null || echo 'audit_backlog_limit=0'"
    pass_when:
      stdout_matches: "audit_backlog_limit=(819[2-9]|8[2-9][0-9][0-9]|9[0-9]{3}|[1-9][0-9]{4,})"

  - id: CIS-RHEL-4.2.1
    title: "Ensure rsyslog is installed and active"
    section: "4.2"
    severity: MEDIUM
    remediation: "dnf install -y rsyslog; systemctl enable --now rsyslog"
    command: "systemctl is-active rsyslog 2>/dev/null"
    pass_when:
      stdout_matches: "^active"

  - id: CIS-RHEL-4.2.2
    title: "Ensure journald is configured to forward to syslog"
    section: "4.2"
    severity: LOW
    remediation: "Set ForwardToSyslog=yes in /etc/systemd/journald.conf"
    command: "grep -E '^\\s*ForwardToSyslog' /etc/systemd/journald.conf 2>/dev/null || true"
    pass_when:
      stdout_matches: "ForwardToSyslog\\s*=\\s*yes"

  - id: CIS-RHEL-4.2.3
    title: "Ensure permissions on /var/log/messages are configured"
    section: "4.2"
    severity: MEDIUM
    remediation: "chmod 0640 /var/log/messages; chown root:root /var/log/messages"
    command: "stat -c '%a %U %G' /var/log/messages 2>/dev/null || true"
    pass_when:
      stdout_matches: "^[06][04]0\\s+root"

  # =========================================================================
  # SECTION 5 — Access / Auth / Authz
  # =========================================================================
  - id: CIS-RHEL-5.1.1
    title: "Ensure crond is active"
    section: "5.1"
    severity: LOW
    remediation: "systemctl enable --now crond"
    command: "systemctl is-active crond 2>/dev/null"
    pass_when:
      stdout_matches: "^active"

  - id: CIS-RHEL-5.2.1
    title: "Ensure permissions on /etc/ssh/sshd_config"
    section: "5.2"
    severity: HIGH
    remediation: "chmod 600 /etc/ssh/sshd_config; chown root:root /etc/ssh/sshd_config"
    command: "stat -c '%a %U %G' /etc/ssh/sshd_config 2>/dev/null || true"
    pass_when:
      stdout_matches: "^[0-6]00\\s+root\\s+root"

  - id: CIS-RHEL-5.2.2
    title: "Ensure SSH PermitRootLogin is disabled"
    section: "5.2"
    severity: HIGH
    remediation: "sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config; systemctl restart sshd"
    command: "sshd -T 2>/dev/null | grep -iE '^permitrootlogin' || true"
    pass_when:
      stdout_matches: "^permitrootlogin\\s+no"

  - id: CIS-RHEL-5.2.3
    title: "Ensure SSH PermitEmptyPasswords is disabled"
    section: "5.2"
    severity: CRITICAL
    remediation: "sed -i 's/^#*PermitEmptyPasswords.*/PermitEmptyPasswords no/' /etc/ssh/sshd_config"
    command: "sshd -T 2>/dev/null | grep -iE '^permitemptypasswords' || true"
    pass_when:
      stdout_matches: "^permitemptypasswords\\s+no"

  - id: CIS-RHEL-5.2.4
    title: "Ensure SSH X11Forwarding is disabled"
    section: "5.2"
    severity: MEDIUM
    remediation: "Set X11Forwarding no in sshd_config"
    command: "sshd -T 2>/dev/null | grep -iE '^x11forwarding' || true"
    pass_when:
      stdout_matches: "^x11forwarding\\s+no"

  - id: CIS-RHEL-5.2.5
    title: "Ensure SSH MaxAuthTries is 4 or less"
    section: "5.2"
    severity: MEDIUM
    remediation: "Set MaxAuthTries 4 in sshd_config"
    command: "sshd -T 2>/dev/null | awk '/^maxauthtries/ {print $2}' || true"
    pass_when:
      stdout_matches: "^[1-4]\\s*$"

  - id: CIS-RHEL-5.2.6
    title: "Ensure only strong SSH ciphers (no CBC)"
    section: "5.2"
    severity: HIGH
    remediation: "Configure Ciphers to exclude CBC variants"
    command: "sshd -T 2>/dev/null | grep -iE '^ciphers' || true"
    pass_when:
      not:
        stdout_matches: "cbc"

  - id: CIS-RHEL-5.2.7
    title: "Ensure SSH ClientAliveInterval and CountMax are set"
    section: "5.2"
    severity: LOW
    remediation: "Set ClientAliveInterval 300 and ClientAliveCountMax 2 in sshd_config"
    command: "sshd -T 2>/dev/null | awk '/^clientaliveinterval/ {print $2}' || true"
    pass_when:
      stdout_matches: "^[1-9][0-9]{1,3}\\s*$"

  - id: CIS-RHEL-5.3.1
    title: "Ensure sudo is installed"
    section: "5.3"
    severity: MEDIUM
    remediation: "dnf install -y sudo"
    command: "rpm -q sudo 2>/dev/null | grep -v 'not installed' | head -1 || echo 'not installed'"
    pass_when:
      not:
        stdout_contains: "not installed"

  - id: CIS-RHEL-5.3.2
    title: "Ensure sudo use_pty is set"
    section: "5.3"
    severity: MEDIUM
    remediation: "echo 'Defaults use_pty' >> /etc/sudoers.d/00-cis-usepty"
    command: "grep -iRE 'Defaults\\s+use_pty' /etc/sudoers /etc/sudoers.d/ 2>/dev/null || true"
    pass_when:
      not:
        stdout_empty: true

  - id: CIS-RHEL-5.3.3
    title: "Ensure sudo logfile exists"
    section: "5.3"
    severity: MEDIUM
    remediation: "echo 'Defaults logfile=/var/log/sudo.log' >> /etc/sudoers.d/00-cis-logfile"
    command: "grep -iRE 'logfile\\s*=' /etc/sudoers /etc/sudoers.d/ 2>/dev/null || true"
    pass_when:
      not:
        stdout_empty: true

  - id: CIS-RHEL-5.4.1
    title: "Ensure password complexity via pwquality"
    section: "5.4"
    severity: MEDIUM
    remediation: "dnf install -y libpwquality; set minlen=14 minclass=4 in /etc/security/pwquality.conf"
    command: "grep -E '^(minlen|minclass)' /etc/security/pwquality.conf 2>/dev/null || true"
    pass_when:
      stdout_matches: "minlen\\s*=\\s*(1[4-9]|[2-9][0-9])"

  - id: CIS-RHEL-5.4.2
    title: "Ensure pam_faillock is configured (deny <= 5, unlock_time >= 900)"
    section: "5.4"
    severity: MEDIUM
    remediation: "authselect select sssd with-faillock; configure /etc/security/faillock.conf"
    command: "grep -E '^deny' /etc/security/faillock.conf 2>/dev/null || true"
    pass_when:
      stdout_matches: "^deny\\s*=\\s*[1-5]\\b"

  - id: CIS-RHEL-5.5.1
    title: "Ensure password hashing is SHA-512 or yescrypt"
    section: "5.5"
    severity: MEDIUM
    remediation: "In /etc/login.defs set ENCRYPT_METHOD SHA512"
    command: "grep -E '^ENCRYPT_METHOD' /etc/login.defs 2>/dev/null || true"
    pass_when:
      stdout_matches: "SHA512|YESCRYPT"

  - id: CIS-RHEL-5.5.2
    title: "Ensure password expiration <= 365 days"
    section: "5.5"
    severity: LOW
    remediation: "Set PASS_MAX_DAYS 365 in /etc/login.defs"
    command: "awk '/^PASS_MAX_DAYS/ {print $2}' /etc/login.defs 2>/dev/null || true"
    pass_when:
      stdout_matches: "^(3[0-5][0-9]|[12]?[0-9]{1,2})\\s*$"

  - id: CIS-RHEL-5.5.3
    title: "Ensure default umask is 027 or stricter"
    section: "5.5"
    severity: LOW
    remediation: "Set UMASK 027 in /etc/login.defs and /etc/profile"
    command: "grep -E '^UMASK' /etc/login.defs 2>/dev/null || true"
    pass_when:
      stdout_matches: "^UMASK\\s+0?(27|37|77)"

  # =========================================================================
  # SECTION 6 — System Maintenance
  # =========================================================================
  - id: CIS-RHEL-6.1.1
    title: "Ensure /etc/passwd permissions are 644 root:root"
    section: "6.1"
    severity: HIGH
    remediation: "chmod 644 /etc/passwd && chown root:root /etc/passwd"
    command: "stat -c '%a %U %G' /etc/passwd 2>/dev/null || true"
    pass_when:
      stdout_matches: "^644\\s+root\\s+root"

  - id: CIS-RHEL-6.1.2
    title: "Ensure /etc/shadow permissions are 0000 root:root (RHEL default)"
    section: "6.1"
    severity: CRITICAL
    rationale: "RHEL uses 000 permissions on /etc/shadow (only root can read/write via setuid)."
    remediation: "chmod 0 /etc/shadow && chown root:root /etc/shadow"
    command: "stat -c '%a %U %G' /etc/shadow 2>/dev/null || true"
    pass_when:
      stdout_matches: "^(0|000|640)\\s+root\\s+root"

  - id: CIS-RHEL-6.1.3
    title: "Ensure /etc/group permissions are 644 root:root"
    section: "6.1"
    severity: MEDIUM
    remediation: "chmod 644 /etc/group && chown root:root /etc/group"
    command: "stat -c '%a %U %G' /etc/group 2>/dev/null || true"
    pass_when:
      stdout_matches: "^644\\s+root\\s+root"

  - id: CIS-RHEL-6.1.4
    title: "Ensure /etc/sudoers permissions are 440"
    section: "6.1"
    severity: HIGH
    remediation: "chown root:root /etc/sudoers && chmod 440 /etc/sudoers"
    command: "stat -c '%a %U %G' /etc/sudoers 2>/dev/null || true"
    pass_when:
      stdout_matches: "^4[04]0\\s+root\\s+root"

  - id: CIS-RHEL-6.1.5
    title: "Ensure no world-writable files"
    section: "6.1"
    severity: MEDIUM
    remediation: "find / -xdev -type f -perm -0002 -exec chmod o-w {} \\;"
    command: "find / -xdev -type f -perm -0002 2>/dev/null | head -1 || true"
    pass_when:
      stdout_empty: true

  - id: CIS-RHEL-6.1.6
    title: "Ensure no unowned files"
    section: "6.1"
    severity: LOW
    remediation: "find / -xdev \\( -nouser -o -nogroup \\) — reassign or delete"
    command: "find / -xdev \\( -nouser -o -nogroup \\) 2>/dev/null | head -1 || true"
    pass_when:
      stdout_empty: true

  - id: CIS-RHEL-6.2.1
    title: "Ensure no empty password fields in /etc/shadow"
    section: "6.2"
    severity: CRITICAL
    remediation: "passwd -l <user> for each listed username"
    command: 'awk -F: ''($2 == "") { print $1 }'' /etc/shadow'
    pass_when:
      stdout_empty: true

  - id: CIS-RHEL-6.2.2
    title: "Ensure root is the only UID 0 account"
    section: "6.2"
    severity: CRITICAL
    remediation: "Investigate any UID 0 account other than root"
    command: 'awk -F: ''($3 == 0) { print $1 }'' /etc/passwd'
    pass_when:
      stdout_matches: "^root\\s*$"

  - id: CIS-RHEL-6.2.3
    title: "Ensure root PATH integrity (no '.', no empty)"
    section: "6.2"
    severity: MEDIUM
    remediation: "Clean root shell init to remove '.' and empty PATH segments"
    command: "sudo -Hiu root bash -c 'echo $PATH' 2>/dev/null | tr ':' '\\n' | grep -E '^(\\.|)$' || true"
    pass_when:
      stdout_empty: true
