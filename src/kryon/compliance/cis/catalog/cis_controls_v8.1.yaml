  igs:
  - IG2
  - IG3
  description: 'Gestionar el control de acceso para los activos que se conectan remotamente a los recursos empresariales. Determinar el nivel de acceso a los recursos empresariales en función de: si se cuenta con software antimalware actualizado, el cumplimiento de la configuración con el proceso de configuración segura de la empresa, y la verificación de que el sistema operativo y las aplicaciones estén actualizados.'
