- id: '7.7'
  control: 7
  title: Remediar las Vulnerabilidades Detectadas
  asset_type: Software
  asset_type_es: Software
  security_function: Responder
  ig: 2
  igs:
  - IG2
  - IG3
  description: 'Remediar las vulnerabilidades detectadas en el software mediante procesos y herramientas de forma mensual o más frecuente, de acuerdo con el proceso de remediación. | CONTROL 8 Gestión de Registros de Auditoría | | | Salvaguardass: 12 IG1: 3/12 IG2: 11/12 IG3: 12/12 Descripción general Recopilar, alertar, revisar y conservar los registros de auditoría de eventos que puedan ayudar a detectar, comprender o recuperarse de un ataque. ¿Por qué es crítico este Control? La recopilación y el análisis de registros es fundamental para la capacidad de una empresa de detectar rápidamente actividades maliciosas. A veces, los registros de auditoría son la única evidencia de un ataque exitoso. Los atacantes saben que muchas organizaciones mantienen registros de auditoría por razones de cumplimiento, pero rara vez los analizan. Los atacantes aprovechan este conocimiento para ocultar su ubicación, software malicioso y actividades en los equipos de las víctimas. Debido a procesos de análisis de registros deficientes o inexistentes, los atacantes a veces controlan equipos comprometidos durante meses o incluso años sin que nadie en la organización objetivo lo sepa. Existen dos tipos de registros que generalmente se tratan y configuran de forma independiente: registros del sistema y registros de auditoría. Los registros del sistema suelen proporcionar eventos a nivel del sistema que muestran el inicio/fin de procesos, fallos del sistema, etc. Estos son nativos de los sistemas y requieren menos configuración para activarse. Los registros de auditoría, por lo general, incluyen eventos a nivel de usuario—cuándo un usuario inició sesión, accedió a un archivo, etc.—y requieren más planificación y esfuerzo para su implementación. Los registros también son fundamentales para la respuesta ante incidentes. Una vez que se ha detectado un ataque, el análisis de registros puede ayudar a las organizaciones a comprender el alcance del ataque. Registros completos pueden mostrar, por ejemplo, cuándo y cómo ocurrió el ataque, qué información fue accedida y si se produjo exfiltración de datos. La conservación de los registros también es fundamental en caso de que se requiera una investigación posterior o si un ataque permaneció sin ser detectado durante un largo período. | 45 Procedures and tools La mayoría de los activos empresariales y el software ofrecen capacidades de registro. Dichos registros deben estar activados, con los datos enviados a servidores centralizados de registros. Los firewalls, proxies y sistemas de acceso remoto (como redes privadas virtuales (VPN), acceso telefónico, etc.) deben estar configurados para un registro detallado cuando sea beneficioso. La retención de los registros también es importante en caso de que se requiera una investigación de incidentes. Además, todos los activos empresariales deben estar configurados para generar registros de control de acceso cuando un usuario intente acceder a recursos sin los privilegios adecuados. Para evaluar si se está realizando este registro, la empresa debe revisar periódicamente sus registros y compararlos con el inventario de activos empresariales recopilado como parte del Control CIS 1, a fin de garantizar que cada activo gestionado conectado activamente a la red esté generando registros de manera periódica. Salvaguardass'
