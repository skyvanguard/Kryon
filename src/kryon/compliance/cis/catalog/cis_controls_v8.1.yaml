- id: '12.8'
  control: 12
  title: Establecer y Mantener Recursos Informáticos Dedicados para Todo el Trabajo Administrativo
  asset_type: Devices
  asset_type_es: Dispositivos
  security_function: Proteger
  ig: 3
  igs:
  - IG3
  description: 'Establecer y mantener recursos informáticos dedicados, ya sea físicamente o lógicamente separados, para todas las tareas administrativas o tareas que requieran acceso administrativo. Los recursos informáticos deben estar segmentados de la red principal de la empresa y no deben tener acceso a internet. | CONTROL 13 Monitoreo y Defensa de la Red | | | Salvaguardass: 11 IG1: 0/11 IG2: 6/11 IG3: 11/11 Descripción general Operar procesos y herramientas para establecer y mantener un monitoreo integral de la red y defensa contra amenazas de seguridad en toda la infraestructura de red y base de usuarios de la empresa. ¿Por qué es crítico este Control? No se puede confiar en que las defensas de red sean perfectas. Los adversarios continúan evolucionando y madurando, compartiendo o vendiendo información dentro de su comunidad sobre exploits y métodos para eludir los controles de seguridad. Incluso si las herramientas de seguridad funcionan “como se anuncia”, es necesario comprender la postura de riesgo de la empresa para configurarlas, ajustarlas y registrar su actividad de forma eficaz. Frecuentemente, errores de configuración debido a fallas humanas o al desconocimiento de las capacidades de las herramientas dan a las organizaciones una falsa sensación de seguridad. Las herramientas de seguridad solo pueden ser eficaces si respaldan un proceso de monitoreo continuo que permita al personal recibir alertas y responder rápidamente ante incidentes de seguridad. Las empresas que adoptan un enfoque impulsado únicamente por tecnología experimentarán también más falsos positivos, debido a su dependencia excesiva en las alertas de las herramientas. Identificar y responder a estas amenazas requiere visibilidad de todos los vectores de amenaza en la infraestructura, y aprovechar la intervención humana en los procesos de detección, análisis y respuesta. Es fundamental que las empresas grandes o fuertemente atacadas cuenten con una capacidad operativa de seguridad para prevenir, detectar y responder rápidamente ante amenazas cibernéticas antes de que afecten a la organización. Este proceso generará informes de actividad y métricas que ayudarán a mejorar las políticas de seguridad y respaldarán el cumplimiento normativo en muchas organizaciones. Como se ha visto en múltiples ocasiones en la prensa, hay empresas que han sido comprometidas durante semanas, meses o incluso años antes de que se descubra. El principal beneficio de contar con una conciencia situacional integral es aumentar la velocidad de detección y respuesta. Esto es crítico para responder con rapidez cuando se detecta malware, se roban credenciales o se comprometen datos sensibles, con el fin de reducir el impacto para la organización. | 63 Mediante una buena conciencia situacional (es decir, operaciones de seguridad), las empresas identificarán y catalogarán Tácticas, Técnicas y Procedimientos (TTP) de los atacantes, incluidos sus Indicadores de Compromiso (IOC), lo que ayudará a la empresa a adoptar un enfoque más proactivo en la identificación de amenazas o incidentes futuros. La recuperación puede lograrse más rápidamente cuando la respuesta tiene acceso a información completa sobre el entorno y la estructura de la empresa para desarrollar estrategias de respuesta eficaces. Procedimientos y herramientas La mayoría de las empresas no necesitan establecer un Centro de Operaciones de Seguridad (SOC) para obtener conciencia situacional. Esto comienza con entender primero las funciones comerciales críticas, las arquitecturas de red y servidores, los datos y flujos de datos, las conexiones con proveedores de servicios y socios comerciales, y los dispositivos y cuentas de los usuarios finales. Esta información orienta el desarrollo de una arquitectura de seguridad, controles técnicos, procedimientos de registro, monitoreo y respuesta. En el núcleo de este proceso se encuentra un equipo capacitado y organizado que implementa procesos para la detección, análisis y mitigación de incidentes. Estas capacidades pueden ejecutarse internamente, o mediante consultores o un proveedor de servicios gestionados. Las empresas deben considerar las actividades relacionadas con la red, los activos empresariales, las credenciales de usuario y el acceso a los datos. La tecnología desempeñará un papel crucial en la recopilación y análisis de todos los datos, así como en el monitoreo de las redes y activos empresariales tanto internos como externos a la organización. Las empresas deben asegurar visibilidad sobre las plataformas en la nube que podrían no alinearse con la tecnología de seguridad instalada localmente. Redirigir todos los registros importantes a programas analíticos, como soluciones de Gestión de Información y Eventos de Seguridad (SIEM), puede aportar valor; sin embargo, no proporcionan una imagen completa. Las revisiones semanales de registros son necesarias para ajustar los umbrales e identificar eventos anómalos. Las herramientas de correlación pueden hacer que los registros de auditoría sean más útiles para inspecciones manuales posteriores. Estas herramientas no son un reemplazo para el personal calificado en seguridad de la información ni para los administradores de sistemas. Incluso con herramientas automatizadas de análisis de registros, a menudo se requiere experiencia humana e intuición para identificar y comprender los ataques. A medida que este proceso madura, las organizaciones crearán, mantendrán y evolucionarán una base de conocimientos que les ayudará a comprender y evaluar los riesgos comerciales, desarrollando una capacidad interna de inteligencia de amenazas. | La inteligencia de amenazas es la recopilación de TTP extraídos de incidentes y adversarios. Para lograr esto, un programa de conciencia situacional debe definir y evaluar qué fuentes de información son relevantes para detectar, reportar y gestionar ataques. La mayoría de las organizaciones maduras pueden evolucionar hacia actividades de búsqueda de amenazas (threat hunting), donde personal capacitado revisa manualmente registros del sistema y del usuario, flujos de datos y patrones de tráfico para encontrar anomalías. Salvaguardass'
- id: '13.1'
