- id: '13.11'
  control: 13
  title: Ajustar los Umbrales de Generación de Alertas de Eventos de Seguridad
  asset_type: Network
  asset_type_es: Red
  security_function: Detectar
  ig: 3
  igs:
  - IG3
  description: 'Ajustar los umbrales de alerta de eventos de seguridad mensualmente, o con mayor frecuencia. | 67 CONTROL 14 Concientización sobre Seguridad y Capacitación en Habilidades | | | Salvaguardass: 9 IG1: 8/9 IG2: 9/9 IG3: 9/9 Descripción general Establecer y mantener un programa de concientización sobre seguridad para influir en el comportamiento del personal, de modo que sea consciente de la seguridad y esté adecuadamente capacitado para reducir los riesgos de ciberseguridad para la organización. ¿Por qué es crítico este Control? Las acciones de las personas juegan un papel fundamental en el éxito o fracaso del programa de seguridad de una empresa. Es más fácil para un atacante persuadir a un usuario para que haga clic en un enlace o abra un archivo adjunto de correo electrónico que instale malware y permita el acceso a la organización, que encontrar un exploit de red para hacerlo directamente. Los propios usuarios, ya sea de forma intencional o no, pueden causar incidentes como resultado del mal manejo de datos sensibles, enviar un correo electrónico con información confidencial al destinatario equivocado, perder un dispositivo portátil de usuario final, usar contraseñas débiles o reutilizar contraseñas empleadas en sitios públicos. Ningún programa de seguridad puede abordar eficazmente el riesgo cibernético sin una estrategia para enfrentar esta vulnerabilidad humana fundamental. Los usuarios en todos los niveles de la organización enfrentan diferentes riesgos. Por ejemplo: los ejecutivos gestionan información más sensible; los administradores de sistemas tienen la capacidad de controlar el acceso a sistemas y aplicaciones; y los usuarios en finanzas, recursos humanos y contratos tienen acceso a distintos tipos de información sensible que los pueden convertir en objetivos. La capacitación debe actualizarse regularmente. Esto aumentará la cultura de seguridad y desincentivará soluciones de trabajo que impliquen riesgos. | Procedimientos y herramientas Las acciones de las personas juegan un papel fundamental en el éxito o fracaso del programa de seguridad de una empresa de una empresa. Es más fácil para un atacante persuadir a un usuario para que haga clic en un enlace o abra un archivo adjunto de correo electrónico que instale malware y permita el acceso a la organización, que encontrar un exploit de red para hacerlo directamente. Los propios usuarios, ya sea de forma intencional o no, pueden causar incidentes como resultado del mal manejo de datos sensibles, enviar un correo electrónico con información confidencial al destinatario equivocado, perder un dispositivo portátil de usuario final, usar contraseñas débiles o reutilizar contraseñas empleadas en sitios públicos. Ningún programa de seguridad puede abordar eficazmente el riesgo cibernético sin una estrategia para enfrentar esta vulnerabilidad humana fundamental. Los usuarios en todos los niveles de la organización enfrentan diferentes riesgos. Por ejemplo: los ejecutivos gestionan información más sensible; los administradores de sistemas tienen la capacidad de controlar el acceso a sistemas y aplicaciones; y los usuarios en finanzas, recursos humanos y contratos tienen acceso a distintos tipos de información sensible que los pueden convertir en objetivos. La capacitación debe actualizarse regularmente. Esto aumentará la cultura de seguridad y desincentivará soluciones de trabajo que impliquen riesgos. Procedimientos y herramientas Un programa eficaz de capacitación en concientización sobre seguridad no debe limitarse a un video pregrabado una vez al año junto con pruebas periódicas de phishing. Si bien la capacitación anual es necesaria, también deben existir mensajes y notificaciones frecuentes y temáticos sobre seguridad. Esto podría incluir mensajes sobre: uso de contraseñas seguras que coincidan con noticias sobre filtraciones masivas de contraseñas, aumento de intentos de phishing durante la temporada de impuestos, o mayor conciencia sobre correos maliciosos de entregas de paquetes durante las festividades. La capacitación también debe tener en cuenta la postura regulatoria y de amenazas de la organización. Las entidades financieras podrían requerir más formación relacionada con el cumplimiento sobre manejo y uso de datos; las instituciones de salud, sobre datos sanitarios; y los comerciantes, sobre datos de tarjetas de crédito. La capacitación en ingeniería social, como las pruebas de phishing, también debe incluir la concientización sobre tácticas dirigidas a distintos roles. Por ejemplo, el equipo financiero podría recibir intentos de BEC (compromiso de correo empresarial) haciéndose pasar por ejecutivos que solicitan transferencias bancarias, o correos de socios o proveedores comprometidos que piden cambiar la cuenta bancaria para el próximo pago. | 69 Para una cobertura más amplia sobre este tema, los siguientes recursos son útiles para construir un programa eficaz de concientización sobre seguridad: • NIST® SP 800-50 Entrenamiento en Concientización sobre Seguridad de la Información: https:// nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-50r1.pdf • Centro Nacional de Ciberseguridad (Reino Unido): https://www.ncsc.gov.uk/guidance/10-steps- user-education-and-awareness • EDUCAUSE: https://www.educause.edu/focus-areas-and-initiatives/policy-and-security/ cybersecurity-program/awareness-campaigns • Alianza Nacional de Ciberseguridad (NCSA): https://staysafeonline.org/ • SANS Security Awareness: https://www.sans.org/security-awareness-training/resources • Para obtener orientación sobre cómo configurar routers domésticos, consulte la Guía de Seguridad en Redes para Teletrabajo y Oficinas Pequeñas de los Controles CIS: https://www.cisecurity.org/controls/resources?crc=environment-specific-guidance Salvaguardass'
- id: '14.1'
  control: 14
  title: Establecer y Mantener un Programa de Concientización sobre Seguridad
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Gobernar
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Establecer y mantener un programa de concientización sobre seguridad. El propósito de este programa es educar a la fuerza laboral de la empresa sobre cómo interactuar de manera segura con los activos y datos de la organización. Impartir la capacitación al momento de la contratación y, como mínimo, una vez al año. Revisar y actualizar el contenido anualmente o cuando ocurran cambios significativos en la empresa que puedan afectar esta Salvaguarda.
