- id: '9.7'
  control: 9
  title: Deploy and Maintain Email Server Anti-Malware Protections
  asset_type: Network
  asset_type_es: Red
  security_function: Proteger
  ig: 3
  igs:
  - IG3
  description: 'Implementar y mantener protecciones antimalware en el servidor de correo electrónico, como el escaneo de archivos adjuntos y/o entornos aislados (sandboxing). | CONTROL 10 Defensas Contra Malware | | | | Salvaguardass: 7 IG1: 3/7 IG2: 7/7 IG3: 7/7 Descripción general Prevenir o controlar la instalación, propagación y ejecución de aplicaciones, código o scripts maliciosos en los activos empresariales. ¿Por qué es crítico este Control? El software malicioso (a veces clasificado como virus o troyanos) es un aspecto integral y peligroso de las amenazas en internet. Puede tener diversos propósitos, como capturar credenciales, robar datos, identificar otros objetivos dentro de la red y cifrar o destruir información. El malware está en constante evolución y adaptación, ya que las variantes modernas utilizan técnicas de aprendizaje automático. El malware ingresa a una empresa aprovechando vulnerabilidades en los dispositivos de usuario final, archivos adjuntos de correo electrónico, páginas web, servicios en la nube, dispositivos móviles y medios extraíbles. A menudo depende de comportamientos inseguros por parte del usuario final, como hacer clic en enlaces, abrir archivos adjuntos, instalar software o perfiles, o insertar unidades flash USB. El malware moderno está diseñado para evadir, engañar o desactivar las defensas. Las defensas contra malware deben ser capaces de operar en este entorno dinámico mediante automatización, actualizaciones oportunas y rápidas, e integración con otros procesos como la gestión de vulnerabilidades y la respuesta a incidentes. Deben desplegarse en todos los posibles puntos de entrada y activos empresariales para detectar, prevenir la propagación o controlar la ejecución de software o código malicioso. Procedimientos y herramientas Una protección eficaz contra malware incluye suites tradicionales de prevención y detección de malware en los puntos finales. Para asegurar que los indicadores de compromiso (IOC) del malware estén actualizados, las empresas pueden recibir actualizaciones automáticas del proveedor para enriquecer otros datos de amenazas o vulnerabilidades. Estas herramientas se gestionan mejor de forma centralizada para proporcionar coherencia en toda la infraestructura. | 53 Poder bloquear o identificar malware es solo una parte de este Control CIS; también se hace hincapié en la recopilación centralizada de registros para apoyar las alertas, la identificación y la respuesta a incidentes. A medida que los actores maliciosos continúan desarrollando sus metodologías, muchos adoptan un enfoque conocido como “vivir de la tierra” (LotL, por sus siglas en inglés) para minimizar la probabilidad de ser detectados. Este enfoque se refiere al comportamiento del atacante que utiliza herramientas o funciones que ya existen en el entorno objetivo. Habilitar el registro de eventos, según las Salvaguardas del Control 8 de CIS, facilitará significativamente que la empresa rastree los eventos para comprender qué ocurrió y por qué ocurrió. • CIS proporciona una serie de guías para comprender cómo se aplican los Controles CIS a las técnicas más comunes de “vivir de la tierra”: https://www.cisecurity.org/controls/resources?crc=m inimize-your-threats Salvaguardas'
