  description: Implementar una solución de prevención de intrusiones basada en el host en los activos empresariales, cuando sea apropiado y/o compatible. Ejemplos de implementación incluyen el uso de un cliente de Detección y Respuesta en el Punto Final (EDR) o un agente IPS basado en el host.
