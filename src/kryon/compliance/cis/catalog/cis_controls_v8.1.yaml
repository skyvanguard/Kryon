- id: '14.7'
  control: 14
  title: Capacitar al Personal para Identificar y Reportar si sus Activos Empresariales Carecen de Actualizaciones de Seguridad
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Proteger
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Capacitar al personal para que comprenda cómo verificar y reportar la falta de actualizaciones de software o cualquier falla en los procesos y herramientas automatizadas. Parte de esta capacitación debe incluir cómo notificar al personal de TI sobre fallas en dichos procesos y herramientas. | 71
- id: '14.8'
  control: 14
  title: Capacitar al Personal sobre los Riesgos de Conectarse y Transmitir Datos Empresariales a través de Redes Inseguras
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Proteger
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Capacitar a los miembros del personal sobre los peligros de conectarse a redes inseguras o transmitir datos empresariales a través de ellas. Si la empresa cuenta con trabajadores remotos, la capacitación debe incluir orientación para asegurar que todos los usuarios configuren de manera segura la infraestructura de red de sus hogares.
- id: '14.9'
  control: 14
  title: Realizar Capacitación en Concientización sobre Seguridad y Habilidades Específicas para Cada Rol
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: 'Realizar capacitación en concientización sobre seguridad y habilidades específicas según el rol. Ejemplos de implementación incluyen cursos sobre administración segura de sistemas para profesionales de TI, capacitación sobre concientización y prevención de vulnerabilidades OWASP® Top 10 para desarrolladores de aplicaciones web, y capacitación avanzada sobre ingeniería social para puestos de alto perfil. | CONTROL 15 Gestión de Proveedores de Servicios | | | Salvaguardass: 7 IG1: 1/7 IG2: 4/7 IG3: 7/7 Descripción general Desarrollar un proceso para evaluar a los proveedores de servicios que manejan datos sensibles o que son responsables de plataformas o procesos críticos de TI de la empresa, a fin de garantizar que estos proveedores estén protegiendo adecuadamente esas plataformas y datos. ¿Por qué es crítico este Control? En nuestro mundo moderno e interconectado, las empresas dependen de proveedores y socios para ayudar a gestionar sus datos o para proporcionar infraestructura para aplicaciones o funciones clave. Existen numerosos ejemplos donde las brechas de terceros han tenido un impacto significativo en las empresas; por ejemplo, desde finales de los años 2000, se comprometieron tarjetas de pago después de que atacantes infiltraron proveedores de servicios más pequeños en la industria minorista. Ejemplos más recientes incluyen ataques de ransomware que afectan indirectamente a una empresa debido a que uno de sus proveedores quedó inoperativo, causando interrupciones en el negocio. O peor aún, si existe una conexión directa, un ataque de ransomware podría cifrar los datos de la empresa principal. La mayoría de las regulaciones de seguridad y privacidad de los datos requieren que su protección se extienda también a los proveedores de servicios, como es el caso de los acuerdos de asociados comerciales (Business Associate Agreements) bajo la Ley de Portabilidad y Responsabilidad de Seguros de Salud (HIPAA), los requisitos del Consejo de Examinadores de Instituciones Financieras Federales (FFIEC) para el sector financiero, y el programa Cyber Essentials del Reino Unido. La confianza en terceros es una función esencial de Gobernanza, Riesgo y Cumplimiento (GRC), ya que los riesgos no gestionados internamente se transfieren a entidades externas. Aunque la revisión de la seguridad de terceros se ha llevado a cabo durante décadas, no existe un estándar universal para evaluar la seguridad; y muchos proveedores de servicios son auditados por sus clientes múltiples veces al mes, lo que impacta negativamente su productividad. Esto se debe a que cada empresa tiene una lista de verificación o conjunto de estándares diferente para calificar al proveedor. Solo existen unos pocos estándares industriales, como el programa Shared Assessments en el sector financiero, o la herramienta Higher Education Community Vendor Assessment Toolkit (HECVAT) en educación superior. Las compañías de seguros que ofrecen pólizas de ciberseguridad también emplean sus propias métricas. | 73 Aunque una empresa podría enfocar mucho escrutinio en compañías grandes de alojamiento en la nube o de aplicaciones porque hospedan su correo electrónico o aplicaciones críticas, las empresas más pequeñas a menudo representan un mayor riesgo. Con frecuencia, un proveedor de servicios contrata a otras partes para ofrecer complementos o servicios adicionales, como cuando un tercero usa una plataforma o producto de un cuarto proveedor para respaldar a la empresa principal. Procedimientos y herramientas La mayoría de las empresas han utilizado tradicionalmente listas de verificación estándar, como las de ISO 27001 o los Controles CIS. A menudo, este proceso se gestiona a través de hojas de cálculo; sin embargo, actualmente existen plataformas en línea que permiten una gestión centralizada del proceso. No obstante, el enfoque de este Control CIS no está en la lista de verificación, sino en los fundamentos del programa. Asegúrese de revisarlo anualmente, ya que las relaciones y los datos pueden cambiar. Independientemente del tamaño de la empresa, debe existir una política para revisar a los proveedores de servicios, un inventario de estos proveedores y una calificación de riesgo asociada con su impacto potencial en el negocio en caso de un incidente. También se debe incluir cláusulas contractuales que responsabilicen al proveedor si ocurre un incidente que afecte a la empresa. Existen plataformas de evaluación de terceros que tienen inventarios de miles de proveedores de servicios, y que intentan ofrecer una vista centralizada de la industria para ayudar a las empresas a tomar decisiones de riesgo más informadas. Estas plataformas a menudo asignan una puntuación de riesgo dinámica a los proveedores de servicios, basada (generalmente) en evaluaciones técnicas pasivas, o enriquecidas mediante evaluaciones de terceros realizadas por otras empresas. Al realizar evaluaciones, es importante enfocarse en los servicios o departamentos del proveedor que están brindando soporte a la empresa. Un proveedor de servicios que tiene un contrato de servicio de seguridad gestionado o de retención, y que cuenta con un seguro de ciberseguridad, también puede ayudar a reducir el riesgo. También es importante desactivar de forma segura a los proveedores de servicios cuando los contratos se completen o se rescindan. Las actividades de desactivación pueden incluir la desactivación de cuentas de usuario y de servicio, la terminación de los flujos de datos y la eliminación segura de los datos de la empresa que se encuentren en los sistemas del proveedor de servicios. • Para conocer pautas sobre la eliminación segura de medios, consulte NIST® 800-88r1: Guidelines for Media Sanitization, según corresponda: https://nvlpubs.nist.gov/nistpubs/ SpecialPublications/NIST.SP.800-88r1.pdf | Resguardso'
- id: '15.1'
  control: 15
  title: Establecer y Mantener un Inventario de Proveedores de Servicios
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Identificar
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Establecer y mantener un inventario de proveedores de servicios. El inventario debe listar todos los proveedores de servicios conocidos, incluir sus clasificaciones y designar un contacto dentro de la empresa para cada proveedor. Revisar y actualizar el inventario anualmente, o cuando ocurran cambios significativos en la empresa que puedan afectar esta Salvaguarda.
- id: '15.2'
  control: 15
  title: Establecer y Mantener una Política de Gestión de Proveedores de Servicios
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Gobernar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Establecer y mantener una política de gestión de proveedores de servicios. Asegurarse de que la política aborde la clasificación, inventario, evaluación, monitoreo y desactivación de proveedores de servicios. Revisar y actualizar la política anualmente, o cuando ocurran cambios significativos en la empresa que puedan afectar esta Salvaguarda.
- id: '15.3'
  control: 15
  title: Clasificar a los Proveedores de Servicios
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Gobernar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Clasificar a los proveedores de servicios. La clasificación puede considerar una o más características, tales como la sensibilidad de los datos, el volumen de datos, los requisitos de disponibilidad, las regulaciones aplicables, el riesgo inherente y el riesgo mitigado. Actualizar y revisar las clasificaciones anualmente, o cuando ocurran cambios significativos en la empresa que puedan afectar esta Salvaguarda.
- id: '15.4'
  control: 15
  title: Asegurar que los Contratos con Proveedores de Servicios Incluyan Requisitos de Seguridad
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Gobernar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Asegurar que los contratos con proveedores de servicios incluyan requisitos de seguridad. Los requisitos de ejemplo pueden incluir requisitos mínimos del programa de seguridad, notificación y respuesta ante incidentes de seguridad y/o violaciones de datos, requisitos de cifrado de datos y compromisos de eliminación de datos. Estos requisitos de seguridad deben ser coherentes con la política de gestión de proveedores de servicios de la empresa. Revisar los contratos de los proveedores de servicios anualmente para asegurarse de que no falten requisitos de seguridad. | 75
- id: '15.5'
  control: 15
  title: Evaluar a los Proveedores de Servicios
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Gobernar
  ig: 3
  igs:
  - IG3
  description: Evaluar a los proveedores de servicios de acuerdo con la política de gestión de proveedores de servicios de la empresa. El alcance de la evaluación puede variar según la(s) clasificación(es), e incluir la revisión de informes de evaluación estandarizados, como los informes de Control de Organización de Servicios 2 (SOC 2) y la Declaración de Cumplimiento (AoC) de la Industria de Tarjetas de Pago (PCI), cuestionarios personalizados u otros procesos rigurosos apropiados. Reevaluar a los proveedores de servicios al menos una vez al año, o con la firma de contratos nuevos o renovados.
- id: '15.6'
  control: 15
  title: Monitorear a los Proveedores de Servicios
  asset_type: Data
  asset_type_es: Datos
  security_function: Gobernar
  ig: 3
  igs:
  - IG3
  description: Monitorear a los proveedores de servicios de acuerdo con la política de gestión de proveedores de servicios de la empresa. El monitoreo puede incluir la reevaluación periódica del cumplimiento del proveedor de servicios, el seguimiento de notas de versiones de los proveedores y el monitoreo de la dark web.
- id: '15.7'
  control: 15
  title: Desactivar de Forma Segura a los Proveedores de Servicios
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 3
  igs:
  - IG3
  description: 'Desactivar de forma segura a los proveedores de servicios. Las consideraciones de ejemplo incluyen la desactivación de cuentas de usuario y de servicio, la finalización de flujos de datos y la eliminación segura de los datos de la empresa contenidos en los sistemas del proveedor de servicios. | CONTROL 16 Seguridad del Software de Aplicación | | | Salvaguardass: 14 IG1: 0/14 IG2: 11/14 IG3: 14/14 Descripción general Gestionar el ciclo de vida de seguridad del software desarrollado internamente, alojado o adquirido, para prevenir, detectar y remediar debilidades de seguridad antes de que puedan afectar a la empresa. ¿Por qué es crítico este Control? Las aplicaciones proporcionan una interfaz amigable para que los usuarios accedan y gestionen datos de una manera alineada con las funciones empresariales. También minimizan la necesidad de que los usuarios interactúen directamente con funciones del sistema complejas (y potencialmente propensas a errores), como iniciar sesión en una base de datos para insertar o modificar archivos. Las empresas utilizan aplicaciones para gestionar sus datos más sensibles y controlar el acceso a los recursos del sistema. Por lo tanto, un atacante puede usar la propia aplicación para comprometer los datos, en lugar de un complejo ataque a la red y sistemas que intente eludir los controles de seguridad y sensores de red. Por esta razón, proteger las credenciales de usuario (específicamente las credenciales de aplicaciones), tal como se define en el Control CIS 6, es tan importante. A falta de credenciales, los errores de la aplicación son el vector de ataque preferido. Sin embargo, las aplicaciones actuales se desarrollan, operan y mantienen en un entorno altamente complejo, diverso y dinámico. Las aplicaciones se ejecutan en múltiples plataformas: web, móviles, en la nube, etc., con arquitecturas más complejas que las estructuras heredadas de cliente-servidor o base de datos-servidor web. Los ciclos de desarrollo se han acortado, pasando de metodologías extensas tipo cascada a ciclos DevOps con actualizaciones frecuentes de código. Además, las aplicaciones rara vez se crean desde cero, y con frecuencia se “ensamblan” a partir de una mezcla compleja de frameworks de desarrollo, bibliotecas, código existente y nuevo. También existen normativas modernas y en evolución sobre protección de datos que abordan la privacidad del usuario, y que pueden requerir cumplimiento con requisitos regionales o específicos del sector. Estos factores hacen que los enfoques tradicionales de seguridad —como el control (de procesos, fuentes de código, entorno de ejecución, etc.), la inspección y las pruebas— sean mucho más difíciles. Además, el riesgo que una vulnerabilidad de la aplicación introduce podría no comprenderse, excepto en un contexto operativo específico. | 77 Las vulnerabilidades pueden existir por múltiples razones: diseño inseguro, infraestructura insegura, errores de codificación, autenticación débil y falta de pruebas para condiciones inusuales o inesperadas. Los atacantes pueden explotar vulnerabilidades específicas, incluyendo desbordamientos de búfer, exposición a inyecciones de lenguaje SQL (SQLi), scripts entre sitios (XSS), falsificación de solicitudes entre sitios (CSRF) y secuestro de clics (clickjacking) para obtener acceso a datos sensibles o tomar control de activos vulnerables como punto de partida para ataques posteriores. Las aplicaciones y los sitios web también pueden ser utilizados para recolectar credenciales, datos o intentar instalar malware en los usuarios que acceden a ellos. Finalmente, hoy en día es común adquirir plataformas de Software como Servicio (SaaS), donde el software se desarrolla y gestiona completamente a través de un tercero. Estas pueden estar alojadas en cualquier parte del mundo. Esto presenta desafíos para las empresas que necesitan comprender los riesgos que están aceptando al usar estas plataformas; muchas veces no tienen visibilidad sobre las prácticas de desarrollo y seguridad de estas aplicaciones. Algunas de estas plataformas permiten la personalización de sus interfaces y bases de datos. Las empresas que extienden estas aplicaciones deben seguir este Control CIS, como si estuvieran realizando desarrollo personalizado desde cero. Procedimientos y herramientas Para la Versión 8, CIS colaboró con SAFECode para ayudar a desarrollar los procedimientos y Salvaguardas para este Control actualizado de Seguridad del Software de Aplicación. Sin embargo, este es un tema amplio en sí mismo, por lo que (siguiendo los principios generales de los Controles CIS), aquí nos enfocamos en las Salvaguardas más críticas. Estas se derivan de un documento complementario desarrollado por SAFECode, el cual proporciona un tratamiento más profundo del tema y es coherente con su cuerpo de contenido existente. SAFECode desarrolló un enfoque de tres niveles para ayudar a los lectores a identificar en qué Grupo de Desarrollo (DG) se encuentra su empresa como escala de madurez para programas de desarrollo. Los tres niveles de IG (Implementation Groups) usados en las Salvaguardas de CIS inspiraron este enfoque: Grupo de Desarrollo 1 La empresa depende en gran medida de software comercial o de código abierto (OSS) y paquetes, con adiciones ocasionales de pequeñas aplicaciones o sitios web. La empresa es capaz de aplicar buenas prácticas operativas y procedimentales básicas, y de gestionar la seguridad del software provisto por el proveedor siguiendo las guías de los Controles CIS. | Grupo de Desarrollo 2 La empresa depende de algunas aplicaciones personalizadas (desarrolladas internamente o por contratistas), integradas con componentes de terceros, y que se ejecutan localmente o en la nube. El personal de desarrollo aplica buenas prácticas de desarrollo de software. La empresa presta atención a la calidad y mantenimiento del código abierto o comercial del que depende. Grupo de Desarrollo 3 La empresa realiza una inversión significativa en software personalizado, necesario para operar su negocio y servir a sus clientes. Puede alojar el software en su propia infraestructura, en la nube o en ambos, e integrar una amplia gama de componentes de software comerciales y de código abierto. Los proveedores de software y empresas que ofrecen SaaS deben considerar el Grupo de Desarrollo 3 como el conjunto mínimo de requisitos. El primer paso en el desarrollo de un programa de seguridad de aplicaciones es implementar un proceso de gestión de vulnerabilidades. Este proceso debe integrarse al ciclo de vida del desarrollo y debe ser lo suficientemente liviano como para insertarse dentro del flujo normal de corrección de errores. El proceso debe incluir análisis de causa raíz para corregir fallas subyacentes, reduciendo así futuras vulnerabilidades, y una calificación de severidad para priorizar la remediación. Los desarrolladores deben ser capacitados en conceptos de seguridad de aplicaciones y prácticas de codificación segura. Esto incluye un proceso para adquirir o evaluar software, módulos y bibliotecas de terceros usados en la aplicación, asegurándose de que no introduzcan fallas de seguridad. Se debe enseñar a los desarrolladores qué tipos de módulos pueden usar con seguridad, de dónde adquirirlos de forma segura y qué componentes pueden o no deben desarrollar ellos mismos (por ejemplo, cifrado). Las debilidades en la infraestructura que soporta estas aplicaciones pueden introducir riesgos. Los Controles CIS y el concepto de minimizar la superficie de ataque pueden ayudar a asegurar redes, sistemas y cuentas utilizadas dentro de la aplicación. La guía específica puede encontrarse en los Controles CIS 1-7, 12 y 13. El programa ideal de seguridad de aplicaciones introduce seguridad desde las primeras etapas del ciclo de desarrollo de software. La gestión de los problemas de seguridad debe ser coherente e integrarse con la gestión estándar de errores/fallas de software, y no ser un proceso separado que compita por recursos de desarrollo. Equipos de desarrollo más grandes o maduros deben considerar la práctica del modelado de amenazas en la fase de diseño. Las vulnerabilidades a nivel de diseño son menos comunes que las de nivel de código; sin embargo, a menudo son más graves y más difíciles de corregir rápidamente. El modelado de amenazas es el proceso de identificar y abordar fallas de diseño en la seguridad de la aplicación antes de que se cree el código. Requiere capacitación específica, conocimiento técnico y conocimiento del negocio. Lo ideal es que cada equipo de desarrollo cuente con “líderes de seguridad” internos que guíen las prácticas de modelado de amenazas para su software. Esto también proporciona un contexto valioso para actividades posteriores como el análisis de causa raíz y las pruebas de seguridad. | 79 Los equipos de desarrollo más grandes o comerciales también pueden considerar un programa de recompensas por errores (bug bounty), donde se remunera a individuos por encontrar fallas en sus aplicaciones. Dicho programa debe complementar un proceso interno de desarrollo seguro y puede proporcionar un mecanismo eficaz para identificar clases de vulnerabilidades que requieren atención especial. Finalmente, en 2020, NIST® publicó su Marco de Desarrollo de Software Seguro (SSDF), que recopiló las mejores prácticas aprendidas por la industria sobre seguridad de software durante las últimas dos décadas, y creó un marco para planificar, evaluar y comunicar actividades de seguridad de software. Las empresas que adquieren software o servicios pueden usar este marco para definir sus requisitos de seguridad y comprender si el proceso de desarrollo del proveedor sigue buenas prácticas. Algunos recursos sobre seguridad de aplicaciones incluyen: • SAFECode Application Security Addendum: https://safecode.org/cis-controls/ • NIST® SSDF: https://csrc.nist.gov/News/2020/mitigating-risk-of-software-vulns-ssdf • The Software Alliance: https://www.bsa.org/reports/updated-bsa-framework-for-secure-software
    • OWASP®: https://owasp.org/ Salvaguardass'
- id: '16.1'
  control: 16
  title: Establecer y Mantener un Proceso de Desarrollo Seguro de Aplicaciones
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Gobernar
  ig: 2
  igs:
  - IG2
  - IG3
  description: 'Establecer y mantener un proceso de desarrollo seguro de aplicaciones. En dicho proceso se deben abordar elementos como: estándares de diseño seguro de aplicaciones, prácticas de codificación segura, capacitación de desarrolladores, gestión de vulnerabilidades, seguridad del código de terceros y procedimientos de pruebas de seguridad en las aplicaciones. Revisar y actualizar la documentación anualmente o cuando ocurran cambios significativos en la empresa que puedan afectar esta Salvaguarda.'
- id: '16.2'
  control: 16
  title: Establecer y Mantener un Proceso para Aceptar y Abordar Vulnerabilidades de Software
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Gobernar
  ig: 2
  igs:
  - IG2
  - IG3
  description: 'Establecer y mantener un proceso para aceptar y abordar reportes de vulnerabilidades de software, incluyendo un medio para que entidades externas puedan reportarlas. Este proceso debe incluir elementos como: una política de manejo de vulnerabilidades que identifique el proceso de reporte, la parte responsable de gestionar los reportes, así como un proceso para la recepción, asignación, remediación y prueba de remediación. Como parte del proceso, se debe utilizar un sistema de seguimiento de vulnerabilidades que incluya calificaciones de severidad y métricas para medir el tiempo de identificación, análisis y remediación. Revisar y actualizar la documentación anualmente o cuando ocurran cambios significativos que puedan impactar esta Salvaguarda. Los desarrolladores de aplicaciones de terceros deben considerar esto como una política de cara al exterior que ayude a establecer expectativas con las partes interesadas externas.'
- id: '16.3'
  control: 16
  title: Realizar Análisis de Causa Raíz de las Vulnerabilidades de Seguridad
  asset_type: Software
  asset_type_es: Software
  security_function: Detectar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Realizar análisis de causa raíz sobre las vulnerabilidades de seguridad. Al revisar las vulnerabilidades, el análisis de causa raíz consiste en evaluar los problemas subyacentes que crean vulnerabilidades en el código, y permite que los equipos de desarrollo vayan más allá de simplemente corregir vulnerabilidades individuales a medida que surgen.
- id: '16.4'
  control: 16
  title: Establecer y Gestionar un Inventario de Componentes de Software de Terceros
  asset_type: Software
  asset_type_es: Software
  security_function: Identificar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Establecer y gestionar un inventario actualizado de componentes de terceros utilizados en el desarrollo, conocido como “lista de materiales”, así como de componentes destinados a uso futuro. Este inventario debe incluir los riesgos potenciales que cada componente de terceros puede representar. Evaluar la lista al menos mensualmente para identificar cualquier cambio o actualización en estos componentes, y validar que el componente aún cuente con soporte. | 81
- id: '16.5'
  control: 16
  title: Usar Componentes de Software de Terceros Confiables y Actualizados
  asset_type: Software
  asset_type_es: Software
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Usar componentes de software de terceros que sean confiables y estén actualizados. Cuando sea posible, elegir frameworks y bibliotecas establecidos y comprobados que ofrezcan una seguridad adecuada. Adquirir estos componentes de fuentes confiables o evaluar el software en busca de vulnerabilidades antes de su uso.
- id: '16.6'
  control: 16
  title: Establecer y Mantener un Sistema de Clasificación de Severidad y un Proceso para las Vulnerabilidades de Aplicaciones
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Gobernar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Establecer y mantener un sistema de clasificación de severidad y un proceso para las vulnerabilidades de las aplicaciones que facilite priorizar el orden en que se corrigen las vulnerabilidades detectadas. Este proceso incluye establecer un nivel mínimo de aceptabilidad de seguridad para liberar código o aplicaciones. Las clasificaciones de severidad permiten una manera sistemática de priorizar vulnerabilidades, mejorando la gestión del riesgo y ayudando a garantizar que los errores más graves se corrijan primero. Revisar y actualizar el sistema y el proceso anualmente.
- id: '16.7'
  control: 16
  title: Utilizar Plantillas Estándar de Configuración Reforzada para la Infraestructura de Aplicaciones
  asset_type: Software
  asset_type_es: Software
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Utilizar plantillas estándar de configuración reforzada recomendadas por la industria para los componentes de la infraestructura de aplicaciones. Esto incluye servidores, bases de datos y servidores web subyacentes, y se aplica también a contenedores en la nube, componentes de Plataforma como Servicio (PaaS) y componentes de Software como Servicio (SaaS). No permitir que el software desarrollado internamente debilite la configuración reforzada.
- id: '16.8'
  control: 16
  title: Separar los Sistemas de Producción y No Producción
  asset_type: Network
  asset_type_es: Red
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Mantener entornos separados para los sistemas de producción y los de no producción.
- id: '16.9'
  control: 16
  title: Capacitar a los Desarrolladores en Conceptos de Seguridad de Aplicaciones y Codificación Segura
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Asegurar que todo el personal de desarrollo de software reciba capacitación para escribir código seguro dentro de su entorno de desarrollo y responsabilidades específicas. La capacitación puede incluir principios generales de seguridad y prácticas estándar de seguridad en aplicaciones. Realizar la capacitación al menos una vez al año, diseñada para promover la seguridad dentro del equipo de desarrollo y fomentar una cultura de seguridad entre los desarrolladores.
- id: '16.10'
  control: 16
  title: Aplicar Principios de Diseño Seguro en la Arquitectura de Aplicaciones
  asset_type: Software
  asset_type_es: Software
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Aplicar principios de diseño seguro en la arquitectura de las aplicaciones. Los principios de diseño seguro incluyen el concepto de menor privilegio y el refuerzo de la mediación para validar cada operación realizada por el usuario, promoviendo el concepto de “nunca confíes en la entrada del usuario”. Ejemplos incluyen asegurar que se realice y documente la validación explícita de errores para toda entrada, considerando tamaño, tipo de datos y rangos o formatos aceptables. El diseño seguro también implica minimizar la superficie de ataque de la infraestructura de la aplicación, como desactivar puertos y servicios no protegidos, eliminar programas y archivos innecesarios, y renombrar o eliminar cuentas predeterminadas.
- id: '16.11'
  control: 16
  title: Utilizar Módulos o Servicios Verificados para Componentes de Seguridad de Aplicaciones
  asset_type: Software
  asset_type_es: Software
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Utilizar módulos o servicios verificados para los componentes de seguridad de aplicaciones, como gestión de identidades, cifrado, auditoría y registro de eventos. Usar características de la plataforma en funciones críticas de seguridad reducirá la carga de trabajo de los desarrolladores y minimizará la probabilidad de errores de diseño o implementación. Los sistemas operativos modernos proporcionan mecanismos eficaces para la identificación, autenticación y autorización, y hacen que esos mecanismos estén disponibles para las aplicaciones. Usar únicamente algoritmos de cifrado estandarizados, actualmente aceptados y ampliamente revisados. Los sistemas operativos también ofrecen mecanismos para crear y mantener registros de auditoría seguros. | 83
- id: '16.12'
  control: 16
  title: Implementar Verificaciones de Seguridad a Nivel de Código
  asset_type: Software
  asset_type_es: Software
  security_function: Proteger
  ig: 3
  igs:
  - IG3
  description: Aplicar herramientas de análisis estático y dinámico dentro del ciclo de vida de la aplicación para verificar que se sigan las prácticas de codificación segura.
- id: '16.13'
  control: 16
  title: Realizar Pruebas de Penetración en Aplicaciones
  asset_type: Software
  asset_type_es: Software
  security_function: Detectar
  ig: 3
  igs:
  - IG3
  description: Realizar pruebas de penetración en aplicaciones. Para aplicaciones críticas, las pruebas de penetración autenticadas son más adecuadas para encontrar vulnerabilidades de lógica empresarial que los escaneos de código y las pruebas de seguridad automatizadas. Las pruebas de penetración dependen de la habilidad del evaluador para manipular manualmente una aplicación como usuario autenticado y no autenticado.
- id: '16.14'
  control: 16
  title: Realizar Modelado de Amenazas
  asset_type: Software
  asset_type_es: Software
  security_function: Proteger
  ig: 3
  igs:
  - IG3
  description: 'Realizar modelado de amenazas. El modelado de amenazas es el proceso de identificar y abordar fallas de diseño en la seguridad de una aplicación antes de que se cree el código. Se lleva a cabo mediante personas especialmente capacitadas que evalúan el diseño de la aplicación y miden los riesgos de seguridad para cada punto de entrada y nivel de acceso. El objetivo es mapear la aplicación, su arquitectura e infraestructura de manera estructurada para comprender sus debilidades. | CONTROL 17 Gestión de Respuesta ante Incidentes | | | Salvaguardass: 9 IG1: 3/9 IG2: 8/9 IG3: 9/9 Descripción general Establecer un programa para desarrollar y mantener una capacidad de respuesta ante incidentes (por ejemplo, políticas, planes, procedimientos, roles definidos, capacitación y comunicaciones) para prepararse, detectar y responder rápidamente a un ataque. ¿Por qué es crítico este Control? Un programa integral de ciberseguridad incluye capacidades de protección, detección, respuesta y recuperación. Con frecuencia, los dos últimos aspectos son ignorados en empresas con programas de seguridad inmaduros, o la técnica de respuesta ante sistemas comprometidos se limita a restaurarlos a su estado original y continuar. El objetivo principal de la respuesta ante incidentes es identificar amenazas en la empresa, responder antes de que puedan propagarse y remediarlas antes de que causen daño. Si no se entiende el alcance completo de un incidente, cómo ocurrió y qué puede hacerse para prevenirlo en el futuro, los defensores caerán en un ciclo perpetuo de “golpear al topo”. No podemos esperar que nuestras medidas de protección sean efectivas el 100 % del tiempo. Cuando ocurre un incidente, si la empresa no cuenta con un plan documentado —aunque cuente con personal capacitado— será casi imposible conocer los procedimientos adecuados de investigación, reporte, recopilación de datos, responsabilidades de gestión, protocolos legales y estrategia de comunicación que le permitan comprender, gestionar y recuperarse exitosamente del incidente. Junto con la detección, contención y erradicación, la comunicación con las partes interesadas es clave. Si queremos reducir la probabilidad de un impacto significativo debido a un evento cibernético, los líderes de la empresa deben conocer el impacto potencial, de modo que puedan priorizar las decisiones de remediación o restauración que mejor respalden a la organización. Estas decisiones comerciales pueden basarse en el cumplimiento normativo, reglas de divulgación, acuerdos de nivel de servicio con socios o clientes, ingresos o el impacto en la misión. | 85 El tiempo de permanencia, desde que ocurre un ataque hasta que se detecta, puede ser de días, semanas o meses. Cuanto más tiempo permanezca el atacante dentro de la infraestructura de la empresa, más incrustado estará y desarrollará más formas de mantener acceso persistente una vez que sea finalmente descubierto. Con el auge del ransomware —una fuente de ingresos estable para los atacantes— este tiempo de permanencia es crítico, especialmente con tácticas modernas que implican el robo de datos antes de cifrarlos para exigir un rescate. Procedimientos y herramientas Incluso si una empresa no cuenta con recursos internos para realizar una respuesta ante incidentes, sigue siendo fundamental contar con un plan documentado. Este debe incluir las fuentes de protección y detección, una lista de contactos a quienes recurrir para recibir asistencia y planes de comunicación sobre cómo transmitir información al liderazgo, empleados, reguladores, socios y clientes. Después de definir los procedimientos de respuesta ante incidentes, el equipo de respuesta —o un tercero— debe participar en entrenamientos periódicos basados en escenarios, trabajando sobre una serie de situaciones ajustadas a las amenazas y posibles impactos que enfrenta la empresa. Estos escenarios ayudan a asegurar que el liderazgo empresarial y los miembros técnicos comprendan su rol en el proceso de respuesta ante incidentes, y los preparen para manejar situaciones reales. Es inevitable que estos ejercicios y entrenamientos revelen brechas en los planes y procesos, así como dependencias inesperadas, que pueden actualizarse en el plan. Las empresas más maduras deben incluir inteligencia de amenazas y/o búsqueda proactiva de amenazas (“threat hunting”) en su proceso de respuesta ante incidentes. Esto ayudará al equipo a ser más proactivo, identificando atacantes clave o primarios en su empresa o industria para monitorear o buscar sus técnicas, tácticas y procedimientos (TTP). Esto permitirá enfocar las detecciones y definir procedimientos de respuesta que permitan identificar y remediar más rápidamente. Las acciones del Control 17 de los CIS proporcionan pasos específicos de alta prioridad que pueden mejorar la seguridad de la empresa y deben formar parte de cualquier plan integral de respuesta ante incidentes. Además, se recomienda el siguiente recurso dedicado a este tema: • Council of Registered Security Testers (CREST) – Guía de Respuesta ante Incidentes de Ciberseguridad: CREST proporciona orientación, estándares y conocimiento sobre una amplia variedad de temas de defensa cibernética. https://www.crest-approved.org/wp-content/ uploads/2022/04/CSIR-Procurement-Guide-1.pdf | Salvaguardass'
- id: '17.1'
  control: 17
  title: Designar Personal para Gestionar el Manejo de Incidentes
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Responder
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Designar a una persona clave, y al menos un respaldo, que se encargue del proceso de manejo de incidentes de la empresa. El personal de gestión es responsable de coordinar y documentar los esfuerzos de respuesta y recuperación ante incidentes, y puede estar compuesto por empleados internos de la empresa, proveedores de servicios o un enfoque híbrido. Si se utiliza un proveedor de servicios, se debe designar al menos a una persona interna de la empresa para supervisar el trabajo de terceros. Revisar anualmente o cuando ocurran cambios significativos en la empresa que puedan impactar esta Salvaguarda.
- id: '17.2'
  control: 17
  title: Establecer y Mantener Información de Contacto para Reportar Incidentes de Seguridad
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Gobernar
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Establecer y mantener información de contacto para las partes que deben ser informadas sobre incidentes de seguridad. Los contactos pueden incluir personal interno, proveedores de servicios, autoridades policiales, proveedores de seguros cibernéticos, agencias gubernamentales relevantes, socios de Centros de Intercambio y Análisis de Información (ISAC), u otras partes interesadas. Verificar los contactos anualmente para asegurar que la información esté actualizada.
- id: '17.3'
  control: 17
  title: Establecer y Mantener un Proceso Empresarial para Reportar Incidentes
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Gobernar
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Establecer y mantener un proceso empresarial documentado para que el personal reporte incidentes de seguridad. El proceso debe incluir el plazo de reporte, a quién se debe informar, el mecanismo de reporte y la información mínima que se debe proporcionar. Asegurar que el proceso esté disponible públicamente para toda la fuerza laboral. Revisar anualmente o cuando ocurran cambios significativos en la empresa que puedan impactar esta Salvaguarda.
- id: '17.4'
  control: 17
  title: Establecer y Mantener un Proceso de Respuesta ante Incidentes
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Gobernar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Establecer y mantener un proceso documentado de respuesta ante incidentes que contemple roles y responsabilidades, requisitos de cumplimiento normativo y un plan de comunicación. Revisar anualmente o cuando ocurran cambios significativos en la empresa que puedan impactar esta Salvaguarda. | 87
- id: '17.5'
  control: 17
  title: Asignar Roles y Responsabilidades Clave
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Responder
  ig: 2
  igs:
  - IG2
  - IG3
  description: Asignar roles y responsabilidades clave para la respuesta ante incidentes, incluyendo personal de los departamentos legal, TI, seguridad de la información, instalaciones, relaciones públicas, recursos humanos, respondedores de incidentes, analistas y terceros relevantes. Revisar anualmente o cuando ocurran cambios significativos en la empresa que puedan impactar esta Salvaguarda.
- id: '17.6'
  control: 17
  title: Definir Mecanismos para la Comunicación Durante la Respuesta ante Incidentes
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Responder
  ig: 2
  igs:
  - IG2
  - IG3
  description: Determinar cuáles serán los mecanismos primarios y secundarios que se utilizarán para comunicarse y reportar durante un incidente de seguridad. Los mecanismos pueden incluir llamadas telefónicas, correos electrónicos, chat seguro o cartas de notificación. Tener en cuenta que ciertos mecanismos, como los correos electrónicos, pueden verse afectados durante un incidente de seguridad. Revisar anualmente o cuando ocurran cambios significativos en la empresa que puedan impactar esta Salvaguarda.
- id: '17.7'
  control: 17
  title: Realizar Ejercicios de Respuesta ante Incidentes de Forma Rutinaria
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Recuperar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Planificar y ejecutar ejercicios y escenarios rutinarios de respuesta ante incidentes para el personal clave involucrado en el proceso, con el fin de prepararlos para responder ante incidentes reales. Los ejercicios deben evaluar los canales de comunicación, la toma de decisiones y los flujos de trabajo. Realizar las pruebas al menos una vez al año.
- id: '17.8'
  control: 17
  title: Realizar Revisiones Posteriores a los Incidentes
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Recuperar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Realizar revisiones posteriores a los incidentes. Estas revisiones ayudan a prevenir la recurrencia de incidentes mediante la identificación de lecciones aprendidas y acciones de seguimiento.
- id: '17.9'
  control: 17
  title: Establecer y Mantener Umbrales para Incidentes de Seguridad
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Recuperar
  ig: 3
  igs:
  - IG3
  description: 'Establecer y mantener umbrales para incidentes de seguridad, incluyendo, como mínimo, la diferenciación entre un incidente y un evento. Ejemplos pueden incluir: actividad anormal, vulnerabilidad de seguridad, debilidad de seguridad, filtración de datos, incidente de privacidad, etc. Revisar anualmente o cuando ocurran cambios significativos en la empresa que puedan impactar esta Salvaguarda. | 89 CONTROL 18 Pruebas de Penetración | | | Salvaguardass: 5 IG1: 0/5 IG2: 3/5 IG3: 5/5 Descripción general Probar la eficacia y resiliencia de los activos empresariales mediante la identificación y explotación de debilidades en los controles (personas, procesos y tecnología), y simular los objetivos y acciones de un atacante. ¿Por qué es crítico este Control? Una postura defensiva exitosa requiere un programa integral compuesto por políticas y gobernanza eficaces, defensas técnicas sólidas y una acción adecuada por parte de las personas. Sin embargo, rara vez es perfecta. En un entorno complejo donde la tecnología evoluciona constantemente y aparecen nuevas técnicas de ataque con regularidad, las empresas deben probar periódicamente sus controles para identificar brechas y evaluar su resiliencia. Esta prueba puede realizarse desde una perspectiva de red externa, red interna, aplicación, sistema o dispositivo. También puede incluir ingeniería social hacia los usuarios o eludir controles de acceso físico. A menudo, las pruebas de penetración se realizan con fines específicos: • Como una demostración “contundente” de un ataque, usualmente para convencer a los responsables de la toma de decisiones sobre las debilidades de su empresa. • Como medio para probar el funcionamiento correcto de las defensas empresariales (“verificación”) • Para verificar que la empresa haya construido las defensas adecuadas desde el principio (“validación”) Control 18 Pruebas de Penetración: 90 Controles Críticos de Seguridad del CIS® | Las pruebas de penetración independientes pueden ofrecer perspectivas valiosas y objetivas sobre la existencia de vulnerabilidades en los activos y en las personas, y sobre la eficacia de las defensas y controles de mitigación para proteger contra impactos negativos en la empresa. Son parte de un programa continuo de gestión y mejora de la seguridad. También pueden revelar debilidades en los procesos, como una gestión de configuración incompleta o inconsistente, o deficiencias en la capacitación de los usuarios finales. Las pruebas de penetración difieren de las pruebas de vulnerabilidad descritas en el Control CIS Las pruebas de vulnerabilidad simplemente verifican la presencia de activos empresariales inseguros conocidos y se detienen ahí. Las pruebas de penetración van más allá, explotando esas debilidades para ver hasta dónde podría llegar un atacante y qué procesos empresariales o datos podrían verse afectados por la explotación de dicha vulnerabilidad. Este es un detalle importante, y a menudo se utilizan incorrectamente como sinónimos. Las pruebas de vulnerabilidad consisten exclusivamente en escaneos automatizados con validaciones manuales ocasionales de falsos positivos, mientras que las pruebas de penetración requieren más participación humana y análisis, a veces apoyados con herramientas o scripts personalizados. Sin embargo, las pruebas de vulnerabilidad suelen ser el punto de partida de una prueba de penetración. Otro término común es “ejercicios de Red Team”. Estos son similares a las pruebas de penetración en cuanto a que se explotan vulnerabilidades; sin embargo, la diferencia radica en el enfoque. Los Red Teams simulan tácticas, técnicas y procedimientos (TTP) específicos de atacantes para evaluar cómo resistiría el entorno empresarial un ataque por parte de un adversario concreto o de una categoría de adversarios. Procedimientos y herramientas Las pruebas de penetración comienzan con el reconocimiento de la empresa y su entorno, seguido de escaneos para identificar vulnerabilidades que puedan servir como puntos de entrada a la empresa. Es importante asegurarse de que se descubran todos los activos empresariales que estén dentro del alcance, y no solo confiar en una lista estática que podría estar desactualizada o incompleta. A continuación, se identifican las vulnerabilidades en estos objetivos. Se ejecutan exploits sobre estas vulnerabilidades para demostrar específicamente cómo un adversario puede subvertir los objetivos de seguridad de la empresa (por ejemplo, la protección de datos sensibles) o alcanzar objetivos específicos del atacante (por ejemplo, establecer una infraestructura encubierta de Comando y Control - C2). Los resultados proporcionan información más profunda, mediante la demostración, sobre los riesgos empresariales de diversas vulnerabilidades. Esto puede aplicarse a controles de acceso físico, redes, sistemas o capas de aplicaciones, e incluso incluir componentes de ingeniería social. Las pruebas de penetración son costosas, complejas y pueden introducir sus propios riesgos. Deben ser realizadas por personas con experiencia de proveedores reputados. Algunos riesgos incluyen la interrupción inesperada de sistemas que podrían ser inestables, exploits que podrían eliminar o corromper datos o configuraciones, y los informes de las pruebas que deben ser protegidos, ya que contienen instrucciones paso a paso para infiltrarse en la empresa y atacar activos o datos críticos. Control 18 Pruebas de Penetración: Controles Críticos de Seguridad del CIS® | 91 Cada empresa debe definir claramente el alcance y las reglas de participación para las pruebas de penetración. El alcance de estos proyectos debe incluir, como mínimo, los activos empresariales que contienen la información de mayor valor y funcionalidades críticas en producción. También se pueden probar sistemas de menor valor para verificar si pueden ser utilizados como puntos de pivote para comprometer objetivos de mayor valor. Las reglas de participación deben describir, como mínimo, los horarios para realizar las pruebas, su duración y el enfoque general. Solo unas pocas personas dentro de la empresa deben saber cuándo se realiza una prueba de penetración, y debe designarse un punto de contacto principal en caso de que surjan problemas. Es cada vez más común realizar pruebas de penetración a través de un abogado externo, con el fin de proteger el informe de la prueba de divulgaciones legales. Las Salvaguardas de este Control CIS proporcionan pasos específicos de alta prioridad que pueden mejorar la seguridad de la empresa, y deben ser parte de cualquier prueba de penetración. Además, se recomienda utilizar algunos de los excelentes recursos dedicados a este tema para apoyar la planificación, gestión y generación de informes de pruebas de seguridad: • Metodologías de Pruebas de Penetración de OWASP: https://www.owasp.org/index.php/ Penetration_testing_methodologies • Consejo de Normas de Seguridad de PCI: https://www.pcisecuritystandards.org/documents/ Penetration-Testing-Guidance-v1_1.pdf Salvaguardass'
- id: '18.1'
  control: 18
  title: Establecer y Mantener un Programa de Pruebas de Penetración
  asset_type: Documentation
  asset_type_es: Documentación
  security_function: Gobernar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Establecer y mantener un programa de pruebas de penetración adecuado al tamaño, complejidad, industria y nivel de madurez de la empresa. Las características del programa de pruebas de penetración incluyen el alcance (por ejemplo, red, aplicaciones web, interfaces de programación de aplicaciones (API), servicios alojados y controles físicos del recinto); frecuencia; limitaciones (como horarios aceptables y tipos de ataques excluidos); información de contacto; remediación (por ejemplo, cómo se distribuirán internamente los hallazgos); y requisitos retrospectivos.
- id: '18.2'
  control: 18
  title: Realizar Pruebas de Penetración Externas Periódicas
  asset_type: Network
  asset_type_es: Red
  security_function: Detectar
  ig: 2
  igs:
  - IG2
  - IG3
  description: 'Realizar pruebas de penetración externas periódicas de acuerdo con los requisitos del programa, al menos una vez al año. Las pruebas de penetración externas deben incluir actividades de reconocimiento empresarial y del entorno para detectar información explotable. Las pruebas de penetración requieren habilidades y experiencia especializadas, y deben ser realizadas por una parte calificada. Las pruebas pueden realizarse en modalidad de caja blanca o caja negra. Control 18 Pruebas de Penetración: 92 Controles Críticos de Seguridad del CIS®'
- id: '18.3'
  control: 18
  title: Remediar los Hallazgos de las Pruebas de Penetración
  asset_type: Network
  asset_type_es: Red
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Remediar los hallazgos de las pruebas de penetración conforme al proceso documentado de remediación de vulnerabilidades de la empresa. Esto debe incluir la determinación de una línea de tiempo y el nivel de esfuerzo requerido, en función del impacto y la priorización de cada hallazgo identificado.
- id: '18.4'
  control: 18
  title: Validar las Medidas de Seguridad
  asset_type: Network
  asset_type_es: Red
  security_function: Proteger
  ig: 3
  igs:
  - IG3
  description: Validar las medidas de seguridad después de cada prueba de penetración. Si se considera necesario, modificar las reglas y capacidades para detectar las técnicas utilizadas durante la prueba.
- id: '18.5'
  control: 18
  title: Realizar Pruebas de Penetración Internas Periódicas
  asset_type: Network
  asset_type_es: Red
  security_function: Detectar
  ig: 3
  igs:
  - IG3
