- id: '6.8'
  control: 6
  title: Definir y Mantener el Control de Acceso Basado en Roles
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Gobernar
  ig: 3
  igs:
  - IG3
  description: 'Definir y mantener el control de acceso basado en roles, determinando y documentando los derechos de acceso necesarios para cada rol dentro de la empresa con el fin de cumplir exitosamente con sus funciones asignadas. Realizar revisiones del control de acceso a los activos empresariales para validar que todos los privilegios estén autorizados, en un cronograma recurrente al menos una vez al año, o con mayor frecuencia. | CONTROL 7 Gestión Continua de Vulnerabilidades | | | | Salvaguardass: 7 IG1: 4/7 IG2: IG2 IG3: 7/7 Descripción general Desarrollar un plan para evaluar y rastrear continuamente las vulnerabilidades en todos los activos empresariales dentro de la infraestructura de la organización, con el fin de remediarlas y minimizar la ventana de oportunidad para los atacantes. Monitorear fuentes públicas y privadas de la industria para obtener nueva información sobre amenazas y vulnerabilidades. ¿Por qué es crítico este Control? Los defensores cibernéticos enfrentan constantemente desafíos por parte de atacantes que buscan vulnerabilidades dentro de su infraestructura para explotarlas y obtener acceso. Los defensores deben contar con información oportuna sobre amenazas, como actualizaciones de software, parches, avisos de seguridad, boletines de amenazas, etc., y deben revisar regularmente su entorno para identificar estas vulnerabilidades antes que los atacantes. Comprender y gestionar vulnerabilidades es una actividad continua que requiere enfoque, tiempo, atención y recursos. Los atacantes tienen acceso a la misma información y, a menudo, pueden aprovechar las vulnerabilidades más rápido de lo que una empresa puede remediarlas. Mientras exista un lapso de tiempo entre que se conoce una vulnerabilidad y se aplica un parche, los defensores pueden priorizar cuáles vulnerabilidades tienen mayor impacto en la empresa o es más probable que sean explotadas primero por su facilidad de uso. Por ejemplo, cuando los investigadores o la comunidad reportan nuevas vulnerabilidades, los proveedores deben desarrollar y desplegar parches, indicadores de compromiso (IOC) y actualizaciones. Los defensores deben evaluar el riesgo de la nueva vulnerabilidad para la empresa, realizar pruebas de regresión y aplicar el parche. Este proceso nunca es perfecto. Los atacantes podrían estar utilizando una vulnerabilidad que aún no es conocida por la comunidad de seguridad. Podrían haber desarrollado un exploit para esta vulnerabilidad, lo que se conoce como exploit de “día cero” (zero-day). Una vez que la vulnerabilidad se da a conocer en la comunidad, se inicia el proceso mencionado anteriormente. Por lo tanto, los defensores deben tener presente que podría existir un exploit activo cuando la vulnerabilidad se difunde ampliamente. A veces, las vulnerabilidades son conocidas dentro de una comunidad cerrada (por ejemplo, el proveedor aún está desarrollando una solución) durante semanas, meses o incluso años antes de su divulgación pública. Los defensores deben ser conscientes de que siempre podrían existir vulnerabilidades que no pueden remediar, por lo que deben aplicar otros controles para mitigarlas. | 41 Las empresas que no evalúan su infraestructura en busca de vulnerabilidades ni abordan proactivamente los fallos descubiertos enfrentan una probabilidad significativa de que sus activos empresariales sean comprometidos. Los defensores enfrentan desafíos particulares para escalar la remediación en toda la empresa y priorizar acciones con prioridades en conflicto, sin afectar el negocio o la misión de la organización. Procedimientos y herramientas Existe una gran cantidad de herramientas de escaneo de vulnerabilidades disponibles para evaluar la configuración de seguridad de los activos empresariales. Algunas empresas también han encontrado eficaces los servicios comerciales que utilizan dispositivos de escaneo gestionados de forma remota. Para ayudar a estandarizar las definiciones de vulnerabilidades descubiertas en toda la empresa, es preferible usar herramientas de escaneo que asignen las vulnerabilidades a uno o más de los siguientes esquemas y lenguajes de clasificación de vulnerabilidades, configuraciones y plataformas reconocidos por la industria: Common Vulnerabilities and Exposures (CVE®), Common Configuration Enumeration (CCE), Open Vulnerability and Assessment Language (OVAL®), Common Platform Enumeration (CPE), Common Vulnerability Scoring System (CVSS) y/o Extensible Configuration Checklist Description Format (XCCDF). • Más información sobre SCAP se encuentra disponible en: https://nvlpubs.nist.gov/nistpubs/ SpecialPublications/NIST.SP.800-126r3.pdf La frecuencia de las actividades de escaneo debe aumentar a medida que aumenta la diversidad de los activos de una empresa, para tener en cuenta los distintos ciclos de parches de cada proveedor. Las herramientas avanzadas de escaneo de vulnerabilidades pueden configurarse con credenciales de usuario para autenticarse en los activos empresariales y realizar evaluaciones más completas. Estos se denominan “escaneos autenticados”. Además de las herramientas de escaneo que detectan vulnerabilidades y errores de configuración en toda la red, existen diversas herramientas gratuitas y comerciales que pueden evaluar la configuración y los ajustes de seguridad de los activos empresariales. Estas herramientas pueden proporcionar información detallada sobre cambios no autorizados en la configuración o la introducción inadvertida de debilidades de seguridad por parte de los administradores. Las empresas eficaces vinculan sus escáneres de vulnerabilidades con sistemas de gestión de tickets que rastrean y reportan el progreso en la corrección de vulnerabilidades. Esto puede ayudar a resaltar vulnerabilidades críticas no mitigadas ante la alta dirección para garantizar su resolución. Las empresas también pueden rastrear cuánto tiempo les tomó remediar una vulnerabilidad después de haber sido identificada o de haberse emitido un parche. Esto puede apoyar los requisitos de cumplimiento internos o del sector. Algunas organizaciones maduras revisan estos informes en reuniones de comités directivos de seguridad informática, que reúnen a líderes de TI y del negocio para priorizar los esfuerzos de remediación según el impacto empresarial. | Al seleccionar qué vulnerabilidades corregir o qué parches aplicar, una empresa debe complementar el Sistema de Puntuación de Vulnerabilidades Comunes (CVSS) del Forum of Incident Response and Security Teams, Inc. (FIRST) con datos sobre la probabilidad de que un actor de amenazas utilice una vulnerabilidad, o el impacto potencial de un exploit para la empresa. La información sobre la probabilidad de explotación también debe actualizarse periódicamente con base en la información de amenazas más reciente. Por ejemplo, la publicación de un nuevo exploit o nueva inteligencia relacionada con la explotación de una vulnerabilidad debe cambiar la prioridad con la que esta se considera para su parcheo. Existen diversos sistemas comerciales disponibles para que una empresa automatice y mantenga este proceso de forma escalable. Las herramientas de escaneo de vulnerabilidades más eficaces comparan los resultados del escaneo actual con los anteriores para determinar cómo han cambiado las vulnerabilidades en el entorno con el tiempo. El personal de seguridad utiliza estas funciones para realizar análisis de tendencias de vulnerabilidades mes a mes. Finalmente, debe existir un proceso de aseguramiento de calidad para verificar que las actualizaciones de configuración o los parches se implementen correctamente y en todos los activos empresariales relevantes. Salvaguardass'
