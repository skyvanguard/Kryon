  - IG3
  description: Establecer y mantener una instancia aislada de los datos de recuperación. Ejemplos de implementación incluyen el control de versiones de los destinos de respaldo mediante sistemas o servicios fuera de línea, en la nube o fuera del sitio.
- id: '11.5'
  control: 11
  title: Probar la Recuperación de Datos
  asset_type: Data
  asset_type_es: Datos
  security_function: Recuperar
  ig: 2
  igs:
  - IG2
  - IG3
  description: 'Probar la recuperación de respaldos trimestralmente, o con mayor frecuencia, para una muestra de los activos empresariales dentro del alcance. | CONTROL 12 Gestión de la Infraestructura de Red | | | Salvaguardass: 8 IG1: 1/8 IG2: 7/8 IG3: 8/8 Descripción general Establecer, implementar y gestionar activamente (rastrear, reportar, corregir) los dispositivos de red, con el fin de evitar que los atacantes exploten servicios y puntos de acceso vulnerables de la red. ¿Por qué es crítico este Control? Una infraestructura de red segura es una defensa esencial contra los ataques. Esto incluye una arquitectura de seguridad adecuada, abordar las vulnerabilidades que, en muchos casos, son introducidas mediante configuraciones predeterminadas, monitorear los cambios y reevaluar las configuraciones actuales. La infraestructura de red incluye dispositivos como puertas de enlace físicas y virtuales, cortafuegos (firewalls), puntos de acceso inalámbricos, enrutadores (routers) y conmutadores (switches). Las configuraciones predeterminadas de los dispositivos de red están orientadas a facilitar la implementación y el uso, no la seguridad. Las posibles vulnerabilidades predeterminadas incluyen servicios y puertos abiertos, cuentas y contraseñas por defecto (incluidas cuentas de servicio), compatibilidad con protocolos antiguos y vulnerables, y la preinstalación de software innecesario. Los atacantes buscan configuraciones predeterminadas vulnerables, brechas o inconsistencias en las reglas del firewall, enrutadores y conmutadores, y utilizan esos huecos para penetrar las defensas. Explotan fallos en estos dispositivos para acceder a las redes, redirigir el tráfico y/o interceptar datos durante su transmisión. La seguridad de red es un entorno en constante cambio que requiere reevaluaciones periódicas de los diagramas de arquitectura, configuraciones, controles de acceso y flujos de tráfico permitidos. Los atacantes aprovechan el hecho de que las configuraciones de los dispositivos de red se vuelven menos seguras con el tiempo, a medida que los usuarios solicitan excepciones por necesidades específicas del negocio. A veces se implementan estas excepciones, pero no se eliminan cuando ya no son necesarias. En algunos casos, el riesgo de seguridad asociado con una excepción no es analizado ni comparado adecuadamente con la necesidad del negocio, y esto puede cambiar con el tiempo. | 59 Procedimientos y herramientas Las organizaciones deben asegurarse de que la infraestructura de red esté completamente documentada y que los diagramas de arquitectura estén actualizados. Es importante que los componentes clave de la infraestructura cuenten con soporte del proveedor para parches y actualizaciones de funcionalidades. Se deben actualizar los componentes que han alcanzado el fin de su vida útil (EOL, por sus siglas en inglés) antes de la fecha en que dejarán de recibir soporte, o bien aplicar controles de mitigación para aislarlos. Las empresas deben monitorear las versiones y configuraciones de su infraestructura en busca de vulnerabilidades que requieran actualizar los dispositivos de red a la versión más reciente, segura y estable, sin que ello afecte negativamente la infraestructura. Un diagrama actualizado de arquitectura de red, incluidos los diagramas de arquitectura de seguridad, es una base importante para la gestión de la infraestructura. A continuación, se debe contar con una gestión completa de cuentas para el control de acceso, el registro (logging) y el monitoreo. Finalmente, la administración de la infraestructura debe realizarse únicamente mediante protocolos seguros, con autenticación robusta (MFA para gestión de acceso privilegiado, PAM) y desde dispositivos administrativos dedicados o redes fuera de banda (out-of-band). Las herramientas comerciales pueden ser útiles para evaluar los conjuntos de reglas de los dispositivos de filtrado de red, con el fin de determinar si son consistentes o si presentan conflictos. Esto proporciona una verificación automatizada del estado de los filtros de red. Estas herramientas buscan errores en los conjuntos de reglas o en las Listas de Control de Acceso (ACLs) que puedan permitir, por error, el paso de servicios no deseados a través del dispositivo de red. Estas herramientas deben ejecutarse cada vez que se realicen cambios significativos en las reglas de los cortafuegos, las ACLs de los enrutadores u otras tecnologías de filtrado. • Para orientación sobre trabajo remoto y oficinas pequeñas, consulte la Guía de Seguridad en Redes para Teletrabajo y Oficinas Pequeñas de los Controles CIS: https://www.cisecurity.org/controls/resources?crc=environment-specific-guidance Salvaguardass'
