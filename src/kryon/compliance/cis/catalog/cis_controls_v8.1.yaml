safeguards:
- id: '1.1'
  control: 1
  title: Establecer y Mantener un Inventario Detallado de Activos Empresariales
  asset_type: Devices
  asset_type_es: Dispositivos
  security_function: Identificar
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: 'Establecer y mantener un inventario preciso, detallado y actualizado de todos los activos empresariales con el potencial de almacenar o procesar datos, incluyendo: dispositivos de usuario final (incluidos los portátiles y móviles), dispositivos de red, dispositivos no informáticos/dispositivos IoT y servidores. Asegurar que el inventario registre la dirección de red (si es estática), la dirección de hardware, el nombre del equipo, el propietario del activo empresarial, el departamento correspondiente a cada activo y si el activo ha sido aprobado para conectarse a la red. Para dispositivos móviles de usuario final, herramientas tipo MDM pueden apoyar este proceso, cuando sea apropiado. Este inventario incluye activos conectados a la infraestructura de forma física, virtual, remota, así como aquellos en entornos de nube. Además, incluye activos que se conectan regularmente a la infraestructura de red de la empresa, incluso si no están bajo el control de la misma. Revisar y actualizar el inventario de todos los activos empresariales semestralmente, o con mayor frecuencia.'
- id: '1.2'
  control: 1
  title: Abordar Activos No Autorizados
  asset_type: Devices
  asset_type_es: Dispositivos
  security_function: Responder
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Asegurar que exista un proceso para abordar los activos no autorizados de manera semanal. La empresa puede optar por retirar el activo de la red, denegar su conexión remota a la red o poner el activo en cuarentena. | 17
- id: '1.3'
  control: 1
  title: Utilizar una Herramienta de Descubrimiento Activo
  asset_type: Devices
  asset_type_es: Dispositivos
  security_function: Detectar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Utilizar una herramienta de descubrimiento activo para identificar los activos conectados a la red de la empresa. Configurar la herramienta de descubrimiento activo para que se ejecute diariamente o con mayor frecuencia.
- id: '1.4'
  control: 1
  title: Utilizar el Registro de Protocolo de Configuración Dinámica de Host (DHCP) para Actualizar el Inventario de Activos Empresariales
  asset_type: Devices
  asset_type_es: Dispositivos
  security_function: Identificar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Utilizar el registro DHCP en todos los servidores DHCP o herramientas de gestión de direcciones de Protocolo de Internet (IP) para actualizar el inventario de activos de la empresa. Revisar y utilizar los registros para actualizar el inventario de activos empresariales semanalmente, o con mayor frecuencia.
- id: '1.5'
  control: 1
  title: Usar una Herramienta de Descubrimiento Pasivo de Activos
  asset_type: Devices
  asset_type_es: Dispositivos
  security_function: Detectar
  ig: 3
  igs:
  - IG3
  description: 'Usar una herramienta de descubrimiento pasivo para identificar los activos conectados a la red de la empresa. Revisar y utilizar los escaneos para actualizar el inventario de activos empresariales al menos semanalmente, o con mayor frecuencia. | CONTROL 2 Inventario y Control de Activos de Software | | | Salvaguardass: 7 IG1: 3/7 IG2: 6/7 IG3: 7/7 Descripción general Gestionar activamente (inventariar, rastrear y corregir) todo el software (sistemas operativos y aplicaciones) en la red para que solo el software autorizado esté instalado y pueda ejecutarse, y para que el software no autorizado y no gestionado sea detectado y se impida su instalación o ejecución. ¿Por qué es crítico este Control? Un inventario completo de software es una base fundamental para prevenir ataques. Los atacantes escanean continuamente las empresas objetivo en busca de versiones vulnerables de software que puedan ser explotadas remotamente. Por ejemplo, si un usuario abre un sitio web malicioso o un archivo adjunto con un navegador vulnerable, un atacante puede instalar programas de acceso encubierto y bots que le otorguen control a largo plazo sobre el sistema. Los atacantes también pueden usar este acceso para moverse lateralmente a través de la red. Una de las principales defensas contra estos ataques es actualizar y aplicar parches al software. Sin embargo, sin un inventario completo de activos de software, una empresa no puede determinar si tiene software vulnerable o si existen posibles violaciones de licencias. Incluso si un parche aún no está disponible, una lista completa de software permite a una empresa protegerse contra ataques conocidos hasta que el parche sea liberado. Algunos atacantes sofisticados utilizan “exploits de día cero”, que aprovechan vulnerabilidades previamente desconocidas para las cuales aún no se ha publicado un parche por parte del proveedor del software. Estos errores de diseño proporcionan cero días a los desarrolladores para corregir los problemas antes de que los atacantes puedan explotarlos. Dependiendo de la gravedad del exploit, una empresa puede implementar medidas de mitigación temporales para protegerse contra ataques hasta que el parche esté disponible. La gestión de activos de software también es importante para identificar riesgos de seguridad innecesarios. Una empresa debe revisar su inventario de software para identificar cualquier activo empresarial que ejecute software innecesario para sus fines comerciales. Por ejemplo, un activo empresarial puede venir con software predeterminado instalado que representa un riesgo de seguridad potencial y no proporciona ningún beneficio para la empresa. Es fundamental inventariar, entender, evaluar y gestionar todo el software conectado a la infraestructura de una empresa. | 19 Procedimientos y herramientas Las listas de permitidos (allowlisting) pueden implementarse mediante una combinación de herramientas comerciales de listas blancas, políticas o herramientas de ejecución de aplicaciones que vienen integradas en suites antimalware y sistemas operativos populares. Existen ampliamente disponibles herramientas comerciales de inventario de software que se utilizan en muchas empresas actualmente. Las mejores de estas herramientas proporcionan una verificación de inventario de cientos de software comunes utilizados en las empresas. Las herramientas extraen información sobre el nivel de parches de cada programa instalado para asegurar que sea la versión más reciente y utilizan nombres de aplicaciones estandarizados, como los encontrados en la especificación Common Platform Enumeration (CPE). Las funciones que implementan listas blancas están incluidas en muchas suites modernas de seguridad para endpoints e incluso implementadas de forma nativa en ciertas versiones de sistemas operativos principales. Además, las soluciones comerciales integran cada vez más antimalware, antispyware, cortafuegos personal y sistemas de detección y prevención de intrusos basados en host (IDS/IPS), junto con funcionalidades de permitir o bloquear aplicaciones. En particular, la mayoría de las soluciones de seguridad para endpoints pueden examinar el nombre, la ubicación en el sistema de archivos y/o el hash criptográfico de un ejecutable dado para determinar si la aplicación debe permitirse ejecutarse en la máquina protegida. Las herramientas más eficaces ofrecen listas de permitidos personalizadas basadas en la ruta del ejecutable, hash o coincidencia mediante expresiones regulares. Algunas incluso incluyen una función de aplicaciones no maliciosas pero no aprobadas que permite a los administradores definir reglas para la ejecución de software específico para ciertos usuarios y en horarios determinados. ● Para orientación específica sobre la nube, consulte la Guía Complementaria de la Nube de los Controles CIS: CIS Controls Cloud Companion Guide: https://www.cisecurity.org/controls/resources?crc=environment-specific-guidance ● Para orientación sobre tabletas y teléfonos inteligentes, consulte la Guía Complementaria Móvil de los Controles CIS: CIS Controls Mobile Companion Guide: https://www.cisecurity.org/controls/ resources?crc=environment-specific-guidance ● Para orientación sobre IoT, consulte la Guía Complementaria del Internet de las Cosas de los Controles CIS: CIS Controls Internet of Things Companion Guide: https://www.cisecurity.org/controls/resources?crc=environment-specific-guidance ● Para orientación sobre Sistemas de Control Industrial (ICS), consulte la Guía de Implementación de ICS de los Controles CIS: CIS Controls ICS Implementation Guide: https://www.cisecurity.org/ controls/resources?crc=environment-specific-guidance | Salvaguardass'
- id: '2.1'
  control: 2
  title: Establecer y Mantener un Inventario de Software
  asset_type: Software
  asset_type_es: Software
  security_function: Identificar
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Establecer y mantener un inventario detallado de todo el software con licencia instalado en los activos empresariales. El inventario de software debe documentar el título, el editor, la fecha de instalación/uso inicial y el propósito empresarial de cada entrada; cuando corresponda, incluir el Localizador Uniforme de Recursos (URL), tienda(s) de aplicaciones, versión(es), mecanismo de implementación, fecha de desactivación y número de licencias. Revisar y actualizar el inventario de software semestralmente, o con mayor frecuencia.
- id: '2.2'
  control: 2
  title: Garantizar que el Software Autorizado esté Actualmente Soportado
  asset_type: Software
  asset_type_es: Software
  security_function: Identificar
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Garantizar que solo el software actualmente soportado esté designado como autorizado en el inventario de software para los activos empresariales. Si un software no cuenta con soporte, pero es necesario para el cumplimiento de la misión de la empresa, documentar una excepción que detalle los controles de mitigación y la aceptación del riesgo residual. Para cualquier software sin soporte que no cuente con documentación de excepción, designarlo como no autorizado. Revisar la lista de software para verificar el soporte del software al menos mensualmente, o con mayor frecuencia.
- id: '2.3'
  control: 2
  title: Abordar el Software No Autorizado
  asset_type: Software
  asset_type_es: Software
  security_function: Responder
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Asegurar que el software no autorizado sea eliminado de los activos empresariales o cuente con una excepción documentada. Revisar mensualmente, o con mayor frecuencia.
- id: '2.4'
  control: 2
  title: Utilizar Herramientas Automatizadas de Inventario de Software
  asset_type: Software
  asset_type_es: Software
  security_function: Detectar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Utilizar herramientas de inventario de software, cuando sea posible, en toda la empresa para automatizar el descubrimiento y la documentación del software instalado. | 21
- id: '2.5'
  control: 2
  title: Lista de Permitidos para el Software Autorizado
  asset_type: Software
  asset_type_es: Software
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Utilizar controles técnicos, como listas de permitidos para aplicaciones, para garantizar que solo el software autorizado pueda ejecutarse o ser accedido. Reevaluar semestralmente, o con mayor frecuencia.
- id: '2.6'
  control: 2
  title: Lista de Permitidos para Bibliotecas Autorizadas
  asset_type: Software
  asset_type_es: Software
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Utilizar controles técnicos para garantizar que solo las bibliotecas de software autorizadas, como archivos específicos .dll, .ocx y .so, puedan cargarse en un proceso del sistema. Bloquear la carga de bibliotecas no autorizadas en un proceso del sistema. Reevaluar semestralmente, o con mayor frecuencia.
- id: '2.7'
  control: 2
  title: Lista de Permitidos para Scripts Autorizados
  asset_type: Software
  asset_type_es: Software
  security_function: Proteger
  ig: 3
  igs:
  - IG3
  description: 'Utilizar controles técnicos, como firmas digitales y control de versiones, para garantizar que solo los scripts autorizados, como archivos específicos .ps1 y .py, puedan ejecutarse. Bloquear la ejecución de scripts no autorizados. Reevaluar semestralmente, o con mayor frecuencia. | CONTROL 3 Protección de Datos | | | Salvaguardass: 14 IG1: 6/14 IG2: 12/14 IG3: 14/14 Descripción general Desarrollar procesos y controles técnicos para identificar, clasificar, manejar de forma segura, retener y eliminar datos. ¿Por qué es crítico este Control? Los datos ya no se encuentran únicamente dentro de los límites de una empresa; están en la nube, en dispositivos portátiles de los usuarios finales que trabajan desde casa y, con frecuencia, se comparten con socios o servicios en línea que podrían almacenarlos en cualquier parte del mundo. Además de los datos sensibles que una empresa posee relacionados con finanzas, propiedad intelectual y datos de clientes, también pueden existir numerosas regulaciones internacionales para la protección de datos personales. La privacidad de los datos ha cobrado una importancia creciente, y las empresas están comprendiendo que la privacidad trata sobre el uso y manejo adecuados de los datos, no solo sobre el cifrado. Los datos deben ser gestionados adecuadamente durante todo su ciclo de vida. Estas normas de privacidad pueden ser complejas para empresas multinacionales de cualquier tamaño; sin embargo, existen fundamentos que se pueden aplicar a todas. Una vez que los atacantes han penetrado la infraestructura de una empresa, una de sus primeras tareas es localizar y exfiltrar datos. Las empresas podrían no ser conscientes de que están saliendo datos sensibles de su entorno porque no están monitoreando los flujos de salida de datos. Aunque muchos ataques ocurren en la red, otros implican el robo físico de dispositivos portátiles de usuarios finales, ataques a proveedores de servicios u otros socios que almacenan datos sensibles. Otros activos sensibles de la empresa también pueden incluir dispositivos no informáticos que proporcionan gestión y control de sistemas físicos, como los sistemas SCADA (Supervisory Control and Data Acquisition, por sus siglas en inglés). La pérdida de control por parte de la empresa sobre datos protegidos o sensibles representa un impacto empresarial grave y, a menudo, reportable. Aunque algunos datos se ven comprometidos o se pierden como resultado de robo o espionaje, la gran mayoría son consecuencia de normas de gestión de datos mal comprendidas y errores de los usuarios. La adopción de cifrado de datos, tanto en tránsito como en reposo, puede mitigar el compromiso de datos y, aún más importante, es un requisito normativo para la mayoría de los datos controlados. | 23 Procedimientos y herramientas Es importante que una empresa desarrolle un proceso de gestión de datos que incluya un marco de gestión de datos, directrices de clasificación de datos y requisitos para la protección, manejo, retención y eliminación de datos. También debe existir un proceso para responder a brechas de datos que se integre con el plan de respuesta a incidentes, y con los planes de cumplimiento y comunicación. Para definir los niveles de sensibilidad de los datos, las empresas deben catalogar sus tipos clave de datos y la criticidad general (impacto ante su pérdida o corrupción) para la empresa. Este análisis se utilizaría para crear un esquema general de clasificación de datos para la empresa. Las empresas pueden utilizar etiquetas como “Sensible”, “Confidencial” y “Público”, y clasificar sus datos de acuerdo con estas etiquetas. Una vez definida la sensibilidad de los datos, se debe desarrollar un inventario o mapeo de datos que identifique el software que accede a los datos con diversos niveles de sensibilidad y los activos empresariales que alojan esas aplicaciones. Idealmente, la red debería estar segmentada de manera que los activos empresariales con el mismo nivel de sensibilidad se encuentren en la misma red y estén separados de los activos con diferentes niveles de sensibilidad. Si es posible, se deben utilizar firewalls para controlar el acceso a cada segmento, y aplicar reglas de acceso de usuarios que permitan el acceso únicamente a aquellos con una necesidad empresarial. Para un tratamiento más exhaustivo de este tema, sugerimos los siguientes recursos para ayudar a la empresa con la protección de datos: ● NIST® SP 800-88r1 Guía de Sanitización de Medios: https://nvlpubs.nist.gov/nistpubs/ SpecialPublications/NIST.SP.800-88r1.pdf ● NIST® FIPS 140-2: https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.140-2.pdf ● NIST® FIPS 140-3: https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.140-3.pdf ● Para orientación específica sobre la nube, consulte la Guía complementaria para la nube de los Controles CIS: CIS Controls Cloud Companion Guide: https://www.cisecurity.org/controls/ resources?crc=environment-specific-guidance ● Para orientación sobre tabletas y teléfonos inteligentes, consulte la Guía complementaria para dispositivos móviles de los Controles CIS: CIS Controls Mobile Companion Guide: https://www.cisecurity.org/controls/resources?crc=environment-specific-guidance | Salvaguardass'
- id: '3.1'
  control: 3
  title: Establecer y Mantener un Proceso de Gestión de Datos
  asset_type: Data
  asset_type_es: Datos
  security_function: Gobernar
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Establecer y mantener un proceso documentado de gestión de datos. En dicho proceso, abordar la sensibilidad de los datos, el propietario de los datos, el manejo de los datos, los límites de retención de datos y los requisitos de eliminación, según los estándares de sensibilidad y retención de la empresa. Revisar y actualizar la documentación anualmente, o cuando ocurran cambios significativos en la empresa que puedan afectar esta Salvaguarda.
- id: '3.2'
  control: 3
  title: Establecer y Mantener un Inventario de Datos
  asset_type: Data
  asset_type_es: Datos
  security_function: Identificar
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Establecer y mantener un inventario de datos basado en el proceso de gestión de datos de la empresa. Como mínimo, se debe inventariar la información sensible. Revisar y actualizar el inventario al menos una vez al año, con prioridad en los datos sensibles.
- id: '3.3'
  control: 3
  title: Configurar Listas de Control de Acceso a Datos
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Configurar listas de control de acceso a datos según la necesidad de conocimiento del usuario. Aplicar listas de control de acceso a datos, también conocidas como permisos de acceso, a sistemas de archivos locales y remotos, bases de datos y aplicaciones.
- id: '3.4'
  control: 3
  title: Hacer Cumplir la Retención de Datos
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Retener los datos conforme al proceso documentado de gestión de datos de la empresa. La retención de datos debe incluir tanto los plazos mínimos como los máximos.
- id: '3.5'
  control: 3
  title: Eliminar los Datos de Forma Segura
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: Eliminar los datos de forma segura, según lo estipulado en el proceso documentado de gestión de datos de la empresa. Asegurar que el proceso y método de eliminación sean acordes con la sensibilidad de los datos. | 25
- id: '3.6'
  control: 3
  title: Cifrar los Datos en Dispositivos del Usuario Final
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 1
  igs:
  - IG1
  - IG2
  - IG3
  description: 'Cifrar los datos en los dispositivos del usuario final que contengan datos sensibles. Las implementaciones de ejemplo pueden incluir: Windows BitLocker®, Apple FileVault®, Linux® dm-crypt.'
- id: '3.7'
  control: 3
  title: Establecer y Mantener un Esquema de Clasificación de Datos
  asset_type: Data
  asset_type_es: Datos
  security_function: Identificar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Establecer y mantener un esquema general de clasificación de datos para la empresa. Las empresas pueden utilizar etiquetas como “Sensible”, “Confidencial” y “Público”, y clasificar sus datos de acuerdo con dichas etiquetas. Revisar y actualizar el esquema de clasificación anualmente, o cuando ocurran cambios significativos en la empresa que puedan afectar esta Salvaguarda.
- id: '3.8'
  control: 3
  title: Documentar los Flujos de Datos
  asset_type: Data
  asset_type_es: Datos
  security_function: Identificar
  ig: 2
  igs:
  - IG2
  - IG3
  description: Documentar los flujos de datos. La documentación de flujos de datos incluye los flujos de datos con proveedores de servicios y debe basarse en el proceso de gestión de datos de la empresa. Revisar y actualizar la documentación anualmente, o cuando ocurran cambios significativos en la empresa que puedan afectar esta Salvaguarda.
- id: '3.9'
  control: 3
  title: Cifrar los Datos en Medios Removibles
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Cifrar los datos en medios removibles..
- id: '3.10'
  control: 3
  title: Cifrar los Datos Sensibles en Reposo
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: 'Cifrar los datos sensibles en tránsito. Las implementaciones de ejemplo pueden incluir: Transport Layer Security (TLS) y Open Secure Shell (OpenSSH).'
- id: '3.11'
  control: 3
  title: Cifrar los Datos Sensibles en Reposo
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Cifrar los datos sensibles en reposo en servidores, aplicaciones y bases de datos. El cifrado a nivel de almacenamiento, también conocido como cifrado del lado del servidor, cumple con el requisito mínimo de esta Salvaguarda. Métodos adicionales de cifrado pueden incluir cifrado a nivel de aplicación, también conocido como cifrado del lado del cliente, donde el acceso al dispositivo de almacenamiento de datos no permite el acceso a los datos en texto plano.
- id: '3.12'
  control: 3
  title: Segmentar el Procesamiento y Almacenamiento de Datos Según su Sensibilidad
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 2
  igs:
  - IG2
  - IG3
  description: Segmentar el procesamiento y almacenamiento de datos según la sensibilidad de los mismos. No procesar datos sensibles en activos empresariales destinados a datos de menor sensibilidad.
- id: '3.13'
  control: 3
  title: Implementar una Solución de Prevención de Pérdida de Datos
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 3
  igs:
  - IG3
  description: Implementar una herramienta automatizada, como una herramienta de Prevención de Pérdida de Datos (DLP, por sus siglas en inglés) basada en el host, para identificar todos los datos sensibles almacenados, procesados o transmitidos a través de los activos empresariales, incluidos aquellos ubicados en sitio o en un proveedor de servicios remoto, y actualizar el inventario de datos de la empresa.
- id: '3.14'
  control: 3
  title: Registrar el Acceso a Datos Sensibles
  asset_type: Data
  asset_type_es: Datos
  security_function: Detectar
  ig: 3
  igs:
  - IG3
  description: 'Registrar el acceso a datos sensibles, incluida su modificación y eliminación. | 27 CONTROL 4 Configuración Segura de Activos Empresariales y Software | | | Salvaguardass: 12 IG1: 7/12 IG2: 11/12 IG3: 12/12 Descripción general Establecer y mantener la configuración segura de los activos empresariales (dispositivos de usuario final, incluidos los portátiles y móviles; dispositivos de red; dispositivos no informáticos/IoT; y servidores) y del software (sistemas operativos y aplicaciones). ¿Por qué es crítico este Control? Tal como se entregan por parte de los fabricantes y distribuidores, las configuraciones predeterminadas para los activos empresariales y el software suelen estar orientadas a facilitar la implementación y el uso, en lugar de la seguridad. Controles básicos, servicios y puertos abiertos, cuentas o contraseñas predeterminadas, configuraciones preestablecidas del Sistema de Nombres de Dominio (DNS), protocolos antiguos (vulnerables) y la preinstalación de software innecesario pueden ser elementos explotables si se dejan en su estado predeterminado. Además, estas actualizaciones de configuración de seguridad deben gestionarse y mantenerse durante todo el ciclo de vida de los activos empresariales y el software. Las actualizaciones de configuración deben ser registradas y aprobadas a través de un proceso de flujo de trabajo de gestión de configuración, con el fin de mantener un registro que pueda ser revisado para cumplimiento, utilizado en la respuesta a incidentes y para respaldar auditorías. Este Control CIS es importante tanto para dispositivos en las instalaciones como para dispositivos remotos, dispositivos de red y entornos en la nube. Los proveedores de servicios desempeñan un papel clave en las infraestructuras modernas, especialmente para las empresas más pequeñas. A menudo, no están configurados de manera predeterminada en la forma más segura, a fin de proporcionar flexibilidad para que sus clientes apliquen sus propias políticas de seguridad. Por lo tanto, la presencia de cuentas o contraseñas predeterminadas, acceso excesivo o servicios innecesarios son comunes en las configuraciones predeterminadas. Estas condiciones pueden introducir vulnerabilidades que están bajo la responsabilidad de la empresa que utiliza el software, en lugar del proveedor de servicios. Esto también se extiende a la gestión y actualizaciones continuas, ya que algunas plataformas como servicio (PaaS) solo cubren el sistema operativo, por lo que el parcheo y actualización de las aplicaciones hospedadas quedan bajo la responsabilidad de la empresa. | Incluso después de desarrollar y aplicar una configuración inicial robusta, esta debe ser gestionada continuamente para evitar una degradación de la seguridad a medida que el software se actualiza o se parchea, se reportan nuevas vulnerabilidades de seguridad y se realizan ajustes de configuración para permitir la instalación de nuevo software o para soportar nuevos requerimientos operativos. Procedimientos y herramientas Existen muchas líneas base de seguridad disponibles para cada sistema. Las empresas deben comenzar con estos puntos de referencia de seguridad, guías o listas de verificación desarrollados, revisados y respaldados públicamente. Algunos recursos incluyen: • Programa de Benchmarks de CIS®: http://www.cisecurity.org/cis-benchmarks/ ● Repositorio del Programa Nacional de Listas de Verificación del NIST® (National Institute of Standards and Technology): https://nvd.nist.gov/ncp/repository Las empresas deben complementar o ajustar estas líneas base para satisfacer las políticas de seguridad de la empresa y los requisitos regulatorios de la industria y del gobierno. Las desviaciones de las configuraciones estándar y su justificación deben documentarse para facilitar revisiones o auditorías futuras. Para una empresa más grande o compleja, existirán múltiples configuraciones de línea base de seguridad según los requisitos de seguridad o la clasificación de los datos en el activo empresarial. A continuación se presenta un ejemplo de pasos para construir una imagen base segura: 1 Determinar la clasificación de riesgo de los datos manejados/almacenados en el activo empresarial (por ejemplo, alto, moderado, bajo riesgo). 2 Crear un script de configuración de seguridad que establezca los parámetros del sistema para cumplir con los requisitos de protección de los datos utilizados en el activo empresarial. Utilizar puntos de referencia como los descritos anteriormente en esta sección. 3 Instalar el software base del sistema operativo. 4 Aplicar los parches adecuados del sistema operativo y de seguridad. 5 nstalar los paquetes de software de aplicaciones, herramientas y utilidades adecuados. 6 Aplicar las actualizaciones apropiadas al software instalado en el paso 4. 7 Instalar scripts de personalización local en esta imagen. 8 Ejecutar el script de seguridad creado en el paso 2 para establecer el nivel de seguridad apropiado. 9 Ejecutar una herramienta que registre o puntúe la configuración del sistema de la imagen base. | 29 10 Realizar una prueba de aseguramiento de calidad de seguridad. 11 Guardar esta imagen base en una ubicación segura. Las herramientas de gestión de configuración comerciales y/o gratuitas, como la herramienta de evaluación de configuración de CIS (CIS-CAT®): https://learn.cisecurity.org/cis-cat-lite, pueden implementarse para medir la configuración de los sistemas operativos y aplicaciones de las máquinas gestionadas con el fin de detectar desviaciones con respecto a las configuraciones estándar de imagen. Las herramientas comerciales de gestión de configuración utilizan alguna combinación de un agente instalado en cada sistema gestionado o inspección sin agente mediante acceso remoto a cada activo empresarial utilizando credenciales de administrador. Adicionalmente, en ocasiones se utiliza un enfoque híbrido, en el que se inicia una sesión remota, se despliega un agente temporal o dinámico en el sistema objetivo para realizar el análisis, y luego se elimina dicho agente. Salvaguardass'
