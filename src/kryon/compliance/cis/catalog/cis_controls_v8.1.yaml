  description: Establecer y mantener un inventario de cuentas de servicio. El inventario debe contener, como mínimo, el departamento responsable, la fecha de revisión y el propósito. Realizar revisiones de cuentas de servicio para validar que todas las cuentas activas estén autorizadas, en un cronograma recurrente al menos trimestral, o con mayor frecuencia.
- id: '5.6'
  control: 5
  title: Centralizar la Gestión de Cuentas
  asset_type: Users
  asset_type_es: Usuarios
  security_function: Gobernar
  ig: 2
  igs:
  - IG2
  - IG3
  description: 'Centralizar la gestión de cuentas mediante un directorio o servicio de identidad. | CONTROL 6 Gestión de Control de Acceso | | | Salvaguardass: 8 IG1: 5/8 IG2: 7/8 IG3: 8/8 Descripción general Utilizar procesos y herramientas para crear, asignar, gestionar y revocar credenciales de acceso y privilegios para cuentas de usuario, administrador y de servicio para activos empresariales y software. ¿Por qué es crítico este Control?? Mientras que el Control CIS 5 trata específicamente de la gestión de cuentas, el Control CIS 6 se enfoca en gestionar a qué tienen acceso estas cuentas, asegurando que los usuarios solo tengan acceso a los datos o activos empresariales apropiados para su función, y que exista una autenticación sólida para datos o funciones empresariales críticas o sensibles. Las cuentas deben tener únicamente la autorización mínima necesaria para su función. Desarrollar derechos de acceso consistentes para cada rol y asignar roles a los usuarios es una buena práctica. También es importante desarrollar un programa completo para la provisión y revocación de acceso. Centralizar esta función es lo ideal. Algunas actividades de los usuarios representan un mayor riesgo para la empresa, ya sea porque se accede desde redes no confiables, o porque se ejecutan funciones administrativas que permiten agregar, cambiar o eliminar otras cuentas, o realizar cambios en la configuración de sistemas operativos o aplicaciones que pueden volverlos menos seguros. Esto también refuerza la importancia del uso de MFA (Autenticación Multifactor) y herramientas de Gestión de Acceso con Privilegios (PAM, por sus siglas en inglés). Algunos usuarios tienen acceso a activos o datos empresariales que no necesitan para su función; esto puede deberse a un proceso inmaduro que otorga acceso completo a todos los usuarios, o a accesos rezagados a medida que los usuarios cambian de roles dentro de la empresa con el tiempo. Los privilegios de administrador local en los portátiles de los usuarios también son un problema, ya que cualquier código malicioso instalado o descargado por el usuario puede tener un mayor impacto en el activo empresarial si se ejecuta con privilegios de administrador. El acceso de cuentas de usuario, administrador y de servicio debe basarse en el rol empresarial y la necesidad. | 37 Procedimientos y herramientas Debe existir un proceso mediante el cual se otorguen y revoquen privilegios para las cuentas de usuario. Este proceso, idealmente, debe basarse en el rol y la necesidad dentro de la empresa mediante control de acceso basado en roles. El control de acceso basado en roles es una técnica para definir y gestionar los requisitos de acceso de cada cuenta en función de: necesidad de conocimiento, mínimo privilegio, requisitos de privacidad y/o separación de funciones. Existen herramientas tecnológicas que ayudan a gestionar este proceso. Sin embargo, puede haber accesos más granulares o temporales según las circunstancias. El uso de MFA debe ser universal para todas las cuentas privilegiadas o de administrador. Existen muchas herramientas con aplicaciones para teléfonos inteligentes que realizan esta función y son fáciles de implementar. Utilizar la función de generador de números es más seguro que simplemente enviar un mensaje de texto (SMS) con un código de un solo uso o enviar una alerta tipo “push” para que el usuario la acepte. Sin embargo, ninguno de estos métodos se recomienda para cuentas privilegiadas. Las herramientas PAM están disponibles para el control de cuentas privilegiadas, y proporcionan una contraseña de un solo uso que debe ser solicitada para cada utilización. Para mayor seguridad en la administración de sistemas, se recomienda el uso de “jump- boxes” o conexiones de terminal fuera de banda. Una revocación de cuentas integral es importante. Muchas empresas cuentan con procesos consistentes y repetibles para eliminar accesos cuando los empleados dejan la organización. Sin embargo, ese proceso no siempre es consistente para contratistas, y debe incluirse dentro del proceso estándar de revocación de accesos. Las empresas también deben inventariar y rastrear las cuentas de servicio, ya que un error común es dejar tokens o contraseñas en texto claro en el código, y publicarlos en repositorios de código en la nube de acceso público. Las cuentas con privilegios elevados no deben usarse para actividades cotidianas, como navegación web o lectura de correos electrónicos. Los administradores deben contar con cuentas separadas que no tengan privilegios elevados para su uso diario en oficina, y solo iniciar sesión con cuentas de administrador al realizar funciones administrativas que requieran ese nivel de autorización. El personal de seguridad debe recopilar periódicamente una lista de procesos en ejecución para determinar si algún navegador o lector de correo está siendo ejecutado con privilegios elevados. • Un recurso excelente son las Directrices de Identidad Digital del NIST®: https://pages.nist. gov/800-63-3/ | Rasguardos'
