- id: '4.12'
  control: 4
  title: Separar los Espacios de Trabajo Empresariales en Dispositivos Móviles de Usuario Final
  asset_type: Data
  asset_type_es: Datos
  security_function: Proteger
  ig: 3
  igs:
  - IG3
  description: 'Asegurar que se utilicen espacios de trabajo empresariales separados en los dispositivos móviles de usuario final, cuando sea compatible. Las implementaciones de ejemplo incluyen el uso de un Perfil de Configuración de Apple® o un Perfil de Trabajo de Android™ para separar las aplicaciones y los datos empresariales de las aplicaciones y los datos personales. | 33 CONTROL 5 Gestión de Cuentas | | | Salvaguardass: 6 IG1: 4/6 IG2: IG2 IG3: 6/6 Descripción general Utilizar procesos y herramientas para asignar y gestionar la autorización de credenciales para cuentas de usuario, incluidas cuentas de administrador, así como cuentas de servicio, para activos empresariales y software. ¿Por qué es crítico este Control? Es más fácil para un actor de amenazas externo o interno obtener acceso no autorizado a los activos o datos de una empresa utilizando credenciales válidas de usuario que mediante la “piratería” del entorno. Existen muchas formas de obtener acceso de forma encubierta a cuentas de usuario, entre ellas: contraseñas débiles, cuentas aún activas después de que un usuario haya dejado la empresa, cuentas de prueba inactivas o rezagadas, cuentas compartidas que no se han cambiado en meses o años, cuentas de servicio incrustadas en aplicaciones o scripts, un usuario que tiene la misma contraseña que usa para una cuenta en línea que ha sido comprometida (en una filtración pública de contraseñas), ingeniería social para que el usuario revele su contraseña, o el uso de malware para capturar contraseñas o tokens en la memoria o a través de la red. Las cuentas administrativas, o con privilegios elevados, son un objetivo particular, ya que permiten a los atacantes agregar otras cuentas o realizar cambios en los activos que podrían hacerlos más vulnerables a otros ataques. Las cuentas de servicio también son sensibles, ya que a menudo son compartidas entre equipos, internos y externos a la empresa, y en ocasiones no se tiene conocimiento de ellas hasta que se revelan en auditorías estándar de gestión de cuentas. Por último, el registro y monitoreo de cuentas es un componente crítico de las operaciones de seguridad. Si bien el registro y monitoreo de cuentas se abordan en el Control CIS 8 (Gestión de Registros de Auditoría), son importantes en el desarrollo de un programa integral de Gestión de Identidad y Acceso (IAM). Procedimientos y herramientas Las cuentas deben ser rastreadas; cualquier cuenta inactiva debe ser deshabilitada y, eventualmente, eliminada del sistema. Deben realizarse auditorías periódicas para asegurar que todas las cuentas activas estén asociadas a usuarios autorizados del activo empresarial. Se debe verificar si se han añadido cuentas nuevas desde la revisión anterior, especialmente cuentas de administrador y cuentas de servicio. Se debe prestar especial atención a la identificación y seguimiento de cuentas administrativas o con altos privilegios y cuentas de servicio. | Los usuarios con acceso de administrador u otros privilegios deben contar con cuentas separadas para esas tareas de mayor autoridad. Estas cuentas solo deben utilizarse al realizar dichas tareas o al acceder a datos especialmente sensibles, con el fin de reducir el riesgo en caso de que su cuenta de usuario normal sea comprometida. Para los usuarios con múltiples cuentas, su cuenta base de usuario, utilizada en el día a día para tareas no administrativas, no debe tener privilegios elevados. El inicio de sesión único (SSO) es conveniente y seguro cuando una empresa cuenta con muchas aplicaciones, incluidas aplicaciones en la nube, lo que ayuda a reducir la cantidad de contraseñas que un usuario debe gestionar. Se recomienda que los usuarios utilicen aplicaciones de administración de contraseñas para almacenar sus contraseñas de forma segura y se les debe instruir que no las guarden en hojas de cálculo o archivos de texto en sus computadoras. Se recomienda el uso de autenticación multifactor (MFA) para el acceso remoto. También se debe cerrar automáticamente la sesión de los usuarios después de un período de inactividad, y se les debe capacitar para bloquear su pantalla al abandonar su dispositivo, con el fin de minimizar la posibilidad de que alguien con proximidad física al usuario acceda a su sistema, aplicaciones o datos. • Un recurso excelente son las Directrices de Identidad Digital del NIST®: https://pages.nist. gov/800-63-3/ • Para orientación sobre la creación y uso de contraseñas, consulte la Guía de Políticas de Contraseñas de CIS: https://www.cisecurity.org/white-papers/cis-password-policy-guide Salvaguardass'
- id: '5.1'
  control: 5
  title: Establecer y Mantener un Inventario de Cuentas
