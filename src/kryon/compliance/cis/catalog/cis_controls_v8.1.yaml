  description: Habilitar funciones de protección contra explotación en los activos empresariales y el software, cuando sea posible, como Microsoft® Data Execution Prevention (DEP), Windows® Defender Exploit Guard (WDEG), o Apple® System Integrity Protection (SIP) y Gatekeeper™.
- id: '10.6'
  control: 10
  title: Gestionar Centralizadamente el Software Antimalware
