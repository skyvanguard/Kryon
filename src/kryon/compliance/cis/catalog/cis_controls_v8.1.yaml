- id: '10.7'
  control: 10
  title: Utilizar Software Antimalware Basado en Comportamiento
  asset_type: Devices
  asset_type_es: Dispositivos
  security_function: Detectar
  ig: 2
  igs:
  - IG2
  - IG3
  description: 'Utilizar software antimalware basado en comportamiento. | 55 CONTROL 11 Recuperación de Datos | | | Salvaguardass: 5 IG1: 4/5 IG2: 5/5 IG3: 5/5 Descripción general Establecer y mantener prácticas de recuperación de datos suficientes para restaurar los activos empresariales dentro del alcance a un estado confiable previo al incidente. ¿Por qué es crítico este Control? En la tríada de ciberseguridad —Confidencialidad, Integridad y Disponibilidad (CIA, por sus siglas en inglés)— la disponibilidad de los datos es, en algunos casos, más crítica que su confidencialidad. Las empresas necesitan muchos tipos de datos para tomar decisiones comerciales, y cuando esos datos no están disponibles o no son confiables, pueden afectar a la organización. Un ejemplo sencillo es la información meteorológica para una empresa de transporte. Cuando los atacantes comprometen activos, realizan cambios en las configuraciones, agregan cuentas y, con frecuencia, instalan software o scripts. Estos cambios no siempre son fáciles de identificar, ya que los atacantes podrían haber corrompido o reemplazado aplicaciones confiables con versiones maliciosas, o los cambios podrían parecer nombres de cuentas comunes. Los cambios en la configuración pueden incluir agregar o modificar entradas en el registro, abrir puertos, desactivar servicios de seguridad, eliminar registros u otras acciones maliciosas que hacen que un sistema sea inseguro. Estas acciones no tienen que ser maliciosas; errores humanos también pueden causarlas. Por lo tanto, es importante tener copias de seguridad o espejos recientes que permitan recuperar los activos empresariales y los datos a un estado confiable conocido. En los últimos años ha habido un aumento exponencial del ransomware. No se trata de una amenaza nueva, aunque se ha comercializado y organizado más como un método confiable para que los atacantes obtengan ganancias. Si un atacante cifra los datos de una empresa y exige un rescate para restaurarlos, contar con una copia de seguridad reciente para recuperar el estado confiable puede ser útil. Sin embargo, a medida que el ransomware ha evolucionado, también se ha convertido en una técnica de extorsión, en la cual los datos se exfiltran antes de ser cifrados, y el atacante solicita un pago tanto para restaurar los datos de la empresa como para evitar que sean vendidos o divulgados. En este caso, la restauración solo resolvería el problema de recuperar los sistemas a un estado confiable y continuar las operaciones. Aplicar la orientación contenida en los Controles CIS ayudará a reducir el riesgo de ransomware mediante una mejor higiene cibernética, ya que los atacantes suelen utilizar exploits básicos o antiguos en sistemas inseguros. | Procedimientos y herramientas Los procedimientos de recuperación de datos deben definirse dentro del proceso de gestión de datos descrito en el Control 3 de CIS, Protección de Datos. Esto debe incluir procedimientos de respaldo basados en el valor, la sensibilidad o los requisitos de retención de los datos. Esto ayudará a desarrollar la frecuencia y el tipo de respaldo (completo vs. incremental). Una vez por trimestre (o siempre que se introduzca un nuevo proceso o tecnología de respaldo), un equipo de prueba debe evaluar una muestra aleatoria de respaldos e intentar restaurarlos en un entorno de prueba. Las copias restauradas deben verificarse para asegurar que el sistema operativo, la aplicación y los datos del respaldo estén intactos y sean funcionales. En caso de una infección por malware, los procedimientos de restauración deben utilizar una versión del respaldo que se considere anterior a la infección original. Salvaguardass'
