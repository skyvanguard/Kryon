- id: '8.12'
  control: 8
  title: Recopilar Registros del Proveedor de Servicios
  asset_type: Data
  asset_type_es: Datos
  security_function: Detectar
  ig: 3
  igs:
  - IG3
  description: 'Recopilar registros del proveedor de servicios, cuando sea compatible. Ejemplos de implementación incluyen la recopilación de eventos de autenticación y autorización, eventos de creación y eliminación de datos, y eventos de gestión de usuarios. | CONTROL 9 Protección del Correo Electrónico y Navegadores Web | | | Salvaguardass: 7 IG1: 2/7 IG2: 6/7 IG3: 7/7 Descripción general Mejorar las protecciones y detecciones contra amenazas provenientes de vectores de correo electrónico y web, ya que representan oportunidades para que los atacantes manipulen el comportamiento humano mediante interacción directa. ¿Por qué es crítico este Control? Los navegadores web y los clientes de correo electrónico son puntos de entrada muy comunes para los atacantes debido a su interacción directa con los usuarios dentro de una empresa. El contenido puede ser diseñado para atraer o suplantar a los usuarios y lograr que revelen credenciales, proporcionen datos sensibles o abran un canal que permita a los atacantes obtener acceso, aumentando así el riesgo para la empresa. Dado que el correo electrónico y la web son los principales medios mediante los cuales los usuarios interactúan con entornos y usuarios externos y no confiables, se convierten en objetivos clave tanto para código malicioso como para técnicas de ingeniería social. Además, a medida que las empresas migran a soluciones de correo electrónico basadas en la web o al acceso móvil, los usuarios ya no utilizan clientes de correo electrónico tradicionales con funciones completas, los cuales ofrecían controles de seguridad integrados como cifrado de conexión, autenticación robusta y botones para reportar suplantación de identidad (phishing). Procedimientos y herramientas Navegador web Los ciberdelincuentes pueden explotar los navegadores web de múltiples maneras. Si tienen acceso a exploits de navegadores vulnerables, pueden crear páginas web maliciosas que exploten esas vulnerabilidades al ser visitadas con un navegador inseguro o sin parches. Alternativamente, pueden intentar dirigirse a una variedad de complementos de terceros comunes del navegador web que podrían permitirles integrarse con el navegador o incluso directamente con el sistema operativo o una aplicación. Estos complementos, al igual que cualquier otro software dentro de un entorno, deben ser revisados para detectar vulnerabilidades, mantenerse actualizados con los últimos parches o versiones y estar controlados. Muchos provienen de fuentes no confiables, e incluso algunos están diseñados con fines maliciosos. Por lo tanto, es preferible prevenir que los usuarios instalen, intencionadamente o no, malware oculto en estos complementos, extensiones y añadidos. Actualizaciones simples en la configuración del navegador pueden dificultar significativamente la instalación de malware, al limitar la capacidad de instalar complementos/extensiones y evitar la ejecución automática de ciertos tipos de contenido. | 49 La mayoría de los navegadores populares utilizan bases de datos de sitios de phishing y/o malware para proteger contra amenazas comunes. Una buena práctica es activar estos filtros de contenido y habilitar los bloqueadores de ventanas emergentes. Las ventanas emergentes no solo son molestas; también pueden contener malware incrustado o atraer a los usuarios a hacer clic en enlaces utilizando trucos de ingeniería social. Para reforzar el bloqueo de dominios maliciosos conocidos, también se recomienda suscribirse a servicios de filtrado DNS para bloquear intentos de acceso a estos sitios a nivel de red. Correo electrónico El correo electrónico representa una de las formas más interactivas en que las personas trabajan con los activos empresariales; capacitar y fomentar el comportamiento correcto es tan importante como las configuraciones técnicas. El correo electrónico es el vector de amenaza más común contra las empresas mediante tácticas como el phishing y el compromiso de correo electrónico empresarial (BEC). Utilizar una herramienta de filtrado de spam y escaneo de malware en la puerta de enlace del correo electrónico reduce la cantidad de correos maliciosos y archivos adjuntos que ingresan a la red de la empresa. Implementar Domain-based Message Authentication, Reporting, and Conformance (DMARC) ayuda a reducir actividades de spam y phishing. Instalar una herramienta de cifrado para asegurar los correos y comunicaciones agrega una capa adicional de seguridad para el usuario y la red. Además del bloqueo basado en el remitente, también es útil permitir únicamente ciertos tipos de archivos que los usuarios necesiten para su trabajo. Esto requerirá coordinación con diferentes unidades de negocio para entender qué tipos de archivos reciben por correo electrónico y asegurar que no se interrumpan sus procesos. Dado que las técnicas de phishing por correo electrónico evolucionan constantemente para evadir las reglas de los filtros de spam, es importante capacitar a los usuarios sobre cómo identificar intentos de phishing y notificar al equipo de Seguridad Informática cuando detecten uno. Existen muchas plataformas que realizan pruebas de phishing a los usuarios para ayudar a educarlos sobre diferentes ejemplos y monitorear su progreso a lo largo del tiempo. Compartir este conocimiento con los equipos de Seguridad Informática ayuda a mejorar las capacidades de protección y detección frente a amenazas basadas en correo electrónico. | Salvaguardass'
