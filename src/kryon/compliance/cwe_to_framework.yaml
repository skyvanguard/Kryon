# ---------------------------------------------------------------------------
# CWE → Regulatory Framework mapping (F59)
# ---------------------------------------------------------------------------
# Each top-25 web/app CWE mapped to the specific controls it violates in
# PCI-DSS 4.0, SWIFT CSCF 2024, and BCP Paraguay Res. 12/2021. Used by
# the web-pentest probes to auto-tag every finding — an XSS finding
# becomes "violates PCI-DSS 6.2.4, SWIFT CSCF 2.7, BCP VII" without the
# operator needing to know the mappings.
#
# Schema:
#   <cwe-id>:
#     title:    short CWE title
#     severity: default severity (overridable per-finding)
#     pci_dss:  list of PCI-DSS 4.0 control numbers
#     swift:    list of CSCF control numbers
#     bcp_py:   list of BCP Res. 12/2021 section references
#     owasp:    OWASP Top 10 2021 mapping
# ---------------------------------------------------------------------------

