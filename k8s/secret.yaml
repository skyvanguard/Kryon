apiVersion: v1
kind: Secret
metadata:
  name: kryon-secrets
  namespace: kryon
  labels:
    app.kubernetes.io/name: kryon
type: Opaque
# Values must be base64 encoded.
# Example: echo -n "your-api-key" | base64
data:
  OPENAI_API_KEY: ""      # base64 encoded
  ANTHROPIC_API_KEY: ""   # base64 encoded
  DEEPSEEK_API_KEY: ""    # base64 encoded
