apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kryon-data-pvc
  namespace: kryon-system
  labels:
    app.kubernetes.io/name: kryon
    app.kubernetes.io/component: storage
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  # Uncomment and configure storageClassName if needed
  # storageClassName: standard
