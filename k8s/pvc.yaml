apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kryon-workspace
  namespace: kryon
  labels:
    app.kubernetes.io/name: kryon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kryon-logs
  namespace: kryon
  labels:
    app.kubernetes.io/name: kryon
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
