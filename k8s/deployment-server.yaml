apiVersion: apps/v1
kind: Deployment
metadata:
  name: kryon-server
  namespace: kryon-system
  labels:
    app.kubernetes.io/name: kryon
    app.kubernetes.io/component: server
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kryon
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kryon
        app.kubernetes.io/component: server
        app.kubernetes.io/version: "1.0.0"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: server
        image: kryon/server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8700
          protocol: TCP
        envFrom:
        - configMapRef:
            name: kryon-config
        - secretRef:
            name: kryon-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8700
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8700
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: kryon-data
          mountPath: /data
      volumes:
      - name: kryon-data
        persistentVolumeClaim:
          claimName: kryon-data-pvc
