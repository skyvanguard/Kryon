apiVersion: apps/v1
kind: Deployment
metadata:
  name: kryon
  namespace: kryon
  labels:
    app.kubernetes.io/name: kryon
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kryon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kryon
        app.kubernetes.io/component: agent
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: kryon
          image: kryon:latest
          imagePullPolicy: IfNotPresent
          stdin: true
          tty: true
          envFrom:
            - configMapRef:
                name: kryon-config
            - secretRef:
                name: kryon-secrets
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: logs
              mountPath: /logs
          # KRYON is a CLI, not an HTTP server.
          # Use exec-based probes instead of HTTP.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "from kryon.cli import main; print('OK')"
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import kryon; print('OK')"
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: kryon-workspace
        - name: logs
          persistentVolumeClaim:
            claimName: kryon-logs
      terminationGracePeriodSeconds: 30
